<!DOCTYPE html>
<html lang="es" data-palette="lila">
<head>
<meta charset="UTF-8">
<script>
(function(){
  try {
    var p = localStorage.getItem('estudiantes_palette_v1');
    var viejas = {terracota:'lila', lavanda:'lila', salvia:'verde'};
    if (viejas[p]) p = viejas[p];
    if (p) document.documentElement.setAttribute('data-palette', p);
    var t = localStorage.getItem('estudiantes_theme_v1');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f5fb">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest-estudiante.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Estudiemos</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/aula.css">
<link rel="stylesheet" href="css/estudiante.css">
<link rel="stylesheet" href="css/plataforma.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
</head>
<body class="est">

<header class="app-header" id="appHeader">
  <div class="hdr-inner">
    <div class="hdr-titles">
      <h1 id="headerTitle">Estudiemos</h1>
      <p id="headerSub" style="display:none;"></p>
    </div>
    <button class="icon-btn filled notif-bell" id="notifToggle" type="button" aria-label="Notificaciones" hidden><span class="notif-count" id="notifCount" hidden></span></button>
    <button class="icon-btn filled" id="yoToggle" type="button" aria-label="Tu cuenta" hidden></button>
  </div>
</header>

<!-- Una sola pantalla: lo que viene, lo que hay que hacer, la semana y lo que vimos -->
<main>
  <div id="selectorAulas" class="filter-row" hidden></div>
  <section class="view active" id="view-entrada"></section>
  <section class="view" id="view-inicio"></section>
</main>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheetContent" role="dialog" aria-modal="true"></div>
</div>

<!-- Resolver una tarea con preguntas (pantalla completa, estilo juego) -->
<div class="jugar" id="jugar" hidden></div>

<div class="toast" id="toast" role="status"></div>

<script src="js/comun.js"></script>
<script src="js/plataforma.js"></script>
<script type="module" src="js/estudiante.js"></script>
</body>
</html>
