<!DOCTYPE html>
<html lang="es" data-palette="terracota">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf3ea">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Dejá tu reseña</title>
<style>
  :root{--font-agenda:'Fraunces',Georgia,serif;}
  :root,:root[data-palette="terracota"]{
    --bg:#faf3ea; --card:#ffffff; --text:#3a2b22; --text-dim:#8a7360; --border:#e8d8c3;
    --primary:#c1673b; --primary-dark:#a34f28; --input-bg:#f3e7d8;
  }
  :root[data-palette="salvia"]{
    --bg:#f4f6f1; --card:#ffffff; --text:#2b332a; --text-dim:#71806c; --border:#dbe4d3;
    --primary:#6f8f5c; --primary-dark:#556e46; --input-bg:#e9efe2;
  }
  :root[data-palette="lavanda"]{
    --bg:#f6f3f8; --card:#ffffff; --text:#322b3a; --text-dim:#7d7189; --border:#ddd2e6;
    --primary:#8067a8; --primary-dark:#6a5290; --input-bg:#ece5f1;
  }
  @media (prefers-color-scheme: dark){
    :root[data-palette="terracota"]{--bg:#211a15;--card:#2c2119;--text:#f1e4d6;--text-dim:#b6a08a;--border:#4a392c;--primary:#e08a5b;--primary-dark:#e08a5b;--input-bg:#382a1f;}
    :root[data-palette="salvia"]{--bg:#171c15;--card:#212820;--text:#e6ede1;--text-dim:#a2b099;--border:#3a4535;--primary:#93b97e;--primary-dark:#93b97e;--input-bg:#2a3327;}
    :root[data-palette="lavanda"]{--bg:#1c1721;--card:#26202c;--text:#ece6f0;--text-dim:#ab9fb8;--border:#453a4f;--primary:#ab8ed4;--primary-dark:#ab8ed4;--input-bg:#322a3a;}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{background:var(--bg);}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Nunito',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));}
  .wrap{max-width:460px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:22px 18px;box-shadow:0 6px 24px rgba(0,0,0,.06);}
  .hello{text-align:center;margin-bottom:18px;}
  .hello .emoji{font-size:44px;line-height:1;}
  h1{font-family:var(--font-agenda);font-size:23px;color:var(--primary-dark);margin:10px 0 6px;font-weight:700;}
  .hello p{margin:0;color:var(--text-dim);font-size:14.5px;line-height:1.5;}
  label{display:block;font-size:13px;font-weight:700;color:var(--text-dim);margin:16px 0 6px;}
  input[type=text],textarea,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;font-size:16px;background:var(--input-bg);color:var(--text);font-family:inherit;}
  textarea{min-height:110px;resize:vertical;}
  .stars{display:flex;justify-content:center;gap:8px;margin:4px 0 2px;}
  .stars button{background:none;border:none;padding:0;font-size:40px;line-height:1;cursor:pointer;color:var(--border);transition:transform .1s;}
  .stars button.on{color:#e5a823;}
  .stars button:active{transform:scale(.9);}
  .star-label{text-align:center;font-size:13px;color:var(--text-dim);min-height:18px;font-weight:700;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chips button{padding:9px 13px;border-radius:999px;border:1px solid var(--border);background:var(--input-bg);color:var(--text-dim);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;}
  .chips button.sel{background:var(--primary);border-color:var(--primary);color:#fff;}
  .check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14px;}
  .check input{width:20px;height:20px;flex-shrink:0;margin-top:1px;}
  .btn{display:block;width:100%;margin-top:20px;padding:14px;border:none;border-radius:14px;background:var(--primary);color:#fff;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 6px 14px -6px var(--primary-dark);}
  .btn.secondary{background:var(--input-bg);color:var(--text);box-shadow:none;}
  .hint{font-size:12.5px;color:var(--text-dim);text-align:center;margin-top:10px;}
  .done{text-align:center;}
  .done pre{white-space:pre-wrap;text-align:left;background:var(--input-bg);border-radius:12px;padding:12px;font-family:inherit;font-size:14px;}
  .err{color:#c1453a;font-size:13px;text-align:center;margin-top:10px;min-height:16px;font-weight:700;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="formCard">
    <div class="hello">
      <div class="emoji">⭐</div>
      <h1 id="titulo">¿Cómo fueron las clases?</h1>
      <p id="subtitulo">Tu opinión me ayuda un montón a que otras familias me conozcan. ¡Gracias por tomarte un minuto!</p>
    </div>

    <label style="text-align:center;margin-top:4px;">Puntaje</label>
    <div class="stars" id="stars"></div>
    <div class="star-label" id="starLabel"></div>

    <label for="texto">Contame tu experiencia</label>
    <textarea id="texto" placeholder="Ej: Explica súper claro y con mucha paciencia. Mi hijo mejoró un montón en matemática."></textarea>

    <label for="autor">Tu nombre</label>
    <input type="text" id="autor" placeholder="Ej: Laura" autocomplete="given-name">

    <label>Sos...</label>
    <div class="chips" id="relacion"></div>

    <div class="check">
      <input type="checkbox" id="publicar" checked>
      <span>Acepto que la reseña se muestre con mi nombre (si no, aparece como "Familia de alumno/a").</span>
    </div>

    <div class="err" id="err"></div>
    <button type="button" class="btn" id="enviarBtn">Enviar reseña</button>
    <div class="hint" id="hint">Se abre WhatsApp con tu reseña lista para mandar.</div>
  </div>

  <div class="card done" id="doneCard" hidden>
    <div class="emoji" style="font-size:44px;">💛</div>
    <h1>¡Muchas gracias!</h1>
    <p id="doneMsg" style="color:var(--text-dim);font-size:14.5px;line-height:1.5;"></p>
    <div id="doneExtra"></div>
  </div>
</div>

<script>
(function(){
  const q = new URLSearchParams(location.search);
  const profe = (q.get('p')||'').trim();
  const telefono = (q.get('w')||'').replace(/\D/g,'');
  const alumno = (q.get('a')||'').trim();
  const nivel = (q.get('n')||'').trim();
  const paleta = q.get('c');
  if(['terracota','salvia','lavanda'].includes(paleta)) document.documentElement.setAttribute('data-palette', paleta);
  const meta = document.querySelector('meta[name="theme-color"]');
  meta.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());

  if(profe) document.getElementById('titulo').textContent = `¿Cómo fueron las clases con ${profe}?`;
  if(alumno) document.getElementById('subtitulo').textContent =
    `Contame cómo te resultaron las clases de ${alumno}. Tu opinión me ayuda un montón a que otras familias me conozcan. ¡Gracias por tomarte un minuto!`;

  let estrellas = 0;
  const labels = ['', 'Malas', 'Regulares', 'Buenas', 'Muy buenas', '¡Excelentes!'];
  const starsBox = document.getElementById('stars');
  function renderStars(){
    starsBox.innerHTML = [1,2,3,4,5].map(n=>`<button type="button" aria-label="${n} estrellas" class="${n<=estrellas?'on':''}" data-n="${n}">★</button>`).join('');
    document.getElementById('starLabel').textContent = labels[estrellas];
  }
  starsBox.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    estrellas = Number(b.dataset.n); renderStars();
  });
  renderStars();

  const relaciones = alumno ? ['mamá','papá','alumno/a','familiar'] : ['mamá','papá','alumno/a','familiar','otro'];
  let relacion = '';
  const relBox = document.getElementById('relacion');
  function renderRel(){
    relBox.innerHTML = relaciones.map(r=>`<button type="button" class="${r===relacion?'sel':''}" data-r="${r}">${r==='alumno/a' && alumno ? 'el/la alumno/a' : r}</button>`).join('');
  }
  relBox.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    relacion = b.dataset.r; renderRel();
  });
  renderRel();

  function b64url(obj){
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
    return b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function hoyIso(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  if(!telefono) document.getElementById('hint').textContent = 'Al enviar te muestro el texto para que se lo mandes.';

  document.getElementById('enviarBtn').addEventListener('click', ()=>{
    const texto = document.getElementById('texto').value.trim();
    const autor = document.getElementById('autor').value.trim();
    const publicar = document.getElementById('publicar').checked;
    const err = document.getElementById('err');
    if(!estrellas){ err.textContent = 'Elegí un puntaje de 1 a 5 estrellas ⭐'; return; }
    if(texto.length<3){ err.textContent = 'Escribí un comentario cortito'; return; }
    if(!autor){ err.textContent = 'Poné tu nombre'; return; }
    err.textContent = '';

    const datos = {s:estrellas, t:texto, n:autor, r:relacion, a:alumno, l:nivel, p:publicar, f:hoyIso()};
    const appUrl = new URL('index.html', location.href);
    appUrl.search = '';
    appUrl.hash = 'resena=' + b64url(datos);
    const quien = relacion ? `${autor} (${relacion}${alumno && relacion!=='alumno/a' ? ' de '+alumno : ''})` : autor;
    const msg = `${'⭐'.repeat(estrellas)}\nReseña${profe?' para '+profe:''}:\n"${texto}"\n— ${quien}\n\nGuardala en EstudiAntes 👉 ${appUrl.toString()}`;

    document.getElementById('formCard').hidden = true;
    document.getElementById('doneCard').hidden = false;
    if(telefono){
      document.getElementById('doneMsg').textContent = 'Se abrió WhatsApp con tu reseña. Solo falta tocar "Enviar". Si no se abrió, usá el botón de abajo.';
      document.getElementById('doneExtra').innerHTML = `<a class="btn" href="https://wa.me/${telefono}?text=${encodeURIComponent(msg)}" style="text-decoration:none;">Abrir WhatsApp</a>`;
      location.href = `https://wa.me/${telefono}?text=${encodeURIComponent(msg)}`;
    }else{
      document.getElementById('doneMsg').textContent = 'Copiá este texto y mandáselo por WhatsApp:';
      const pre = document.createElement('pre'); pre.textContent = msg;
      const btn = document.createElement('button'); btn.className = 'btn'; btn.textContent = 'Copiar';
      btn.onclick = ()=>{ (navigator.clipboard ? navigator.clipboard.writeText(msg) : Promise.reject()).then(()=>btn.textContent='¡Copiado!').catch(()=>{}); };
      document.getElementById('doneExtra').append(pre, btn);
    }
  });
})();
</script>
</body>
</html>
