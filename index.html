function renderHistorialPagos(){
  const cont = document.getElementById('historialPagos');
  const pagos = db.pagos.slice().sort((a,b)=> b.fecha.localeCompare(a.fecha));
  if(!pagos.length){
    cont.innerHTML = '<div class="empty-msg" style="padding-bottom:14px;">Todavía no registraste pagos. Cuando te paguen, tocá «Cobrar».</div>';
    return;
  }
  const lista = historialCompleto ? pagos : pagos.slice(0,6);
  let html = '', fechaAnt = null;
  lista.forEach(p=>{
    if(p.fecha!==fechaAnt){ html += `<div class="pago-fecha">${formatoFechaLarga(p.fecha)}</div>`; fechaAnt = p.fecha; }
    const a = p.alumnoId ? getAlumno(p.alumnoId) : null;
    html += `
      <div class="list-item tap" onclick="abrirPagoDetalle('${p.id}')">
        ${a ? avatarHtml(a) : `<div class="row-ic">${ic('file')}</div>`}

          <div class="item-sub">${escapeHtml(conceptoPago(p))}</div>

  cont.innerHTML = html;
}

/* ---------- trabajos prácticos ---------- */
function openTrabajoForm(id){
  const editing = id ? db.trabajos.find(t=>t.id===id) : null;
  const ordenados = db.alumnos.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  const alumnoSel = editing ? (editing.alumnoId || '__otro__') : (ordenados[0] ? ordenados[0].id : '__otro__');
  const min = editing ? (editing.minutos||0) : 120;
  const tarifa = editing ? editing.tarifaHora : (db.config.tarifaTP || 10000);
  openSheet(`
    <h3>${editing ? 'Editar trabajo práctico' : 'Nuevo trabajo práctico'}</h3>
    <p class="sheet-sub">Se cobra según las horas que te llevó y se suma a tu billetera.</p>

    <label for="f_tp_titulo">¿Qué trabajo hiciste?</label>
    <input type="text" id="f_tp_titulo" value="${editing ? escapeAttr(editing.titulo) : ''}" placeholder="Ej: TP de Física – Cinemática" autocomplete="off">

    <label for="f_tp_alumno">¿Para quién?</label>
    <select id="f_tp_alumno" onchange="document.getElementById('tpClienteBox').style.display = this.value==='__otro__' ? 'block':'none';">
      ${ordenados.map(a=>`<option value="${a.id}" ${a.id===alumnoSel?'selected':''}>${escapeHtml(a.nombre)}</option>`).join('')}
      <option value="__otro__" ${alumnoSel==='__otro__'?'selected':''}>Otra persona…</option>
    </select>
    <div id="tpClienteBox" style="display:${alumnoSel==='__otro__'?'block':'none'};">
      <label for="f_tp_cliente">Nombre</label>
      <input type="text" id="f_tp_cliente" value="${editing ? escapeAttr(editing.cliente||'') : ''}" placeholder="Ej: Sofi (prima de Juan)" autocomplete="off">
    </div>

    <div class="field-row">
      <div>
        <label for="f_tp_horas">Tiempo</label>
        <div class="row2" style="gap:6px;">
          <select id="f_tp_horas" onchange="recalcularMontoTP()">${Array.from({length:41},(_,h)=>`<option value="${h}" ${h===Math.floor(min/60)?'selected':''}>${h} h</option>`).join('')}</select>
          <select id="f_tp_mins" onchange="recalcularMontoTP()">${[0,15,30,45].map(m=>`<option value="${m}" ${m===min%60?'selected':''}>${m} min</option>`).join('')}</select>
        </div>
      </div>
    </div>
    <div class="field-row">
      <div>
        <label for="f_tp_tarifa">Tarifa por hora</label>
        <input type="number" id="f_tp_tarifa" min="0" step="500" inputmode="numeric" value="${tarifa}" oninput="recalcularMontoTP()">
      </div>
      <div>
        <label for="f_tp_fecha">Fecha</label>
        <input type="date" id="f_tp_fecha" value="${editing ? editing.fecha : hoyIso()}">
      </div>
    </div>

    <label for="f_tp_monto">Total a cobrar</label>
    <input type="number" id="f_tp_monto" min="0" step="500" inputmode="numeric" value="${editing ? editing.monto : ''}">
    <div class="hint">Se calcula solo (horas × tarifa), pero lo podés ajustar.</div>

    <label class="switch-row">
      <span>Ya lo cobré</span>
      <input type="checkbox" class="switch" id="f_tp_cobrado" ${editing && editing.cobrado ? 'checked':''}>
    </label>

    <details class="more">
      <summary>${ic('chevron-right')}Notas</summary>
      <textarea id="f_tp_notas" style="margin-top:10px;" placeholder="Detalles del trabajo…">${editing ? escapeHtml(editing.notas||'') : ''}</textarea>
    </details>

    <div class="sheet-footer">
      ${editing ? `<button type="button" class="btn danger" onclick="eliminarTrabajo('${editing.id}')" aria-label="Eliminar trabajo">${ic('trash')}</button>` : ''}
      <button type="button" class="btn primary" onclick="guardarTrabajo(${editing ? `'${editing.id}'` : 'null'})">${editing ? 'Guardar cambios' : 'Agregar trabajo'}</button>
    </div>
  `);
  if(!editing) recalcularMontoTP();
}
function minutosTPForm(){
  return (parseInt(document.getElementById('f_tp_horas').value)||0)*60 + (parseInt(document.getElementById('f_tp_mins').value)||0);
}
function recalcularMontoTP(){
  const tarifa = parseFloat(document.getElementById('f_tp_tarifa').value)||0;
  document.getElementById('f_tp_monto').value = Math.round(tarifa*minutosTPForm()/60/100)*100;
}
function guardarTrabajo(id){
  const titulo = document.getElementById('f_tp_titulo').value.trim();
  const sel = document.getElementById('f_tp_alumno').value;
  const alumnoId = sel==='__otro__' ? null : sel;
  const cliente = alumnoId ? '' : document.getElementById('f_tp_cliente').value.trim();
  const fecha = document.getElementById('f_tp_fecha').value || hoyIso();
  const minutos = minutosTPForm();
  const tarifaHora = parseFloat(document.getElementById('f_tp_tarifa').value)||0;
  const monto = parseFloat(document.getElementById('f_tp_monto').value)||0;
  const notas = document.getElementById('f_tp_notas').value.trim();
  const cobrado = document.getElementById('f_tp_cobrado').checked;
  if(!titulo){ showToast('Poné qué trabajo hiciste'); return; }
  if(!alumnoId && !cliente){ showToast('Poné para quién fue'); return; }
  if(minutos<=0){ showToast('¿Cuánto tiempo te llevó?'); return; }

  let t;
  if(id){
    t = db.trabajos.find(x=>x.id===id);
    Object.assign(t, {titulo, alumnoId, cliente, fecha, minutos, tarifaHora, monto, notas});
  }else{
    t = {id: uid(), titulo, alumnoId, cliente, fecha, minutos, tarifaHora, monto, notas, cobrado:false, pagoId:null};
    db.trabajos.push(t);
  }
  if(cobrado && !t.cobrado) registrarPago({alumnoId, cliente, trabajoIds:[t.id], fecha});
  else if(!cobrado && t.cobrado) quitarTrabajoDePago(t);
  else if(cobrado && t.pagoId) recalcularPago(t.pagoId);
  db.config.tarifaTP = tarifaHora || db.config.tarifaTP;
  saveDB();
  closeSheet();
  renderAll();
  showToast('Trabajo práctico guardado');
}
async function eliminarTrabajo(id){
  const ok = await confirmar({titulo:'¿Eliminar este trabajo práctico?', mensaje:'Si estaba cobrado, también se quita del historial de pagos.', ok:'Eliminar', peligro:true});
  if(!ok) return;
  const t = db.trabajos.find(x=>x.id===id);
  if(t && t.cobrado) quitarTrabajoDePago(t);
  db.trabajos = db.trabajos.filter(x=>x.id!==id);
  saveDB();
  closeSheet();
  renderAll();
  showToast('Trabajo eliminado');
}

/* ---------- render billetera ---------- */
function renderStats(){
  const ahora = new Date();

  // saldo por cobrar (todo lo adeudado, de cualquier mes)
  const ds = deudores();
  const total = ds.reduce((s,d)=>s+d.total,0);
  const nClases = ds.reduce((s,d)=>s+d.it.clases.length,0), nTPs = ds.reduce((s,d)=>s+d.it.trabajos.length,0);
  document.getElementById('billeteraPorCobrar').textContent = money(total);
  document.getElementById('billeteraPorCobrarSub').textContent = total>0
    ? [nClases?`${nClases} clase${nClases!==1?'s':''}`:'', nTPs?`${nTPs} trabajo${nTPs!==1?'s':''} práctico${nTPs!==1?'s':''}`:''].filter(Boolean).join(' y ') + ' sin cobrar'
    : 'Estás al día, nadie te debe nada';
  document.getElementById('billeteraDeudoresCard').hidden = !ds.length;
  document.getElementById('billeteraDeudores').innerHTML = ds.map(d=>{
    const a = d.key.startsWith('a:') ? getAlumno(d.key.slice(2)) : null;
    const detalle = [d.it.clases.length?`${d.it.clases.length} clase${d.it.clases.length!==1?'s':''}`:'', d.it.trabajos.length?`${d.it.trabajos.length} TP`:''].filter(Boolean).join(' + ');
    return `
    <div class="list-item">
      ${a ? avatarHtml(a) : `<div class="row-ic">${ic('user')}</div>`}
      <div class="item-main" style="cursor:pointer;" onclick="${a ? `abrirDetalleAlumno('${a.id}')` : `abrirCobro('${jsArg(d.key)}')`}">
        <div class="item-title">${escapeHtml(d.nombre)}</div>
        <div class="item-sub">${detalle}</div>
      </div>
      <div class="item-right warn" style="margin-right:4px;">${money(d.total)}</div>
      <button type="button" class="btn primary sm" onclick="abrirCobro('${jsArg(d.key)}')">Cobrar</button>
    </div>`;
  }).join('');

  // mes seleccionado
  const y = statsFecha.getFullYear(), m = statsFecha.getMonth();
  document.getElementById('statsMesLabel').textContent = capitalizar(statsFecha.toLocaleDateString('es-AR', {month:'long'})) + ' ' + y;
  const enMes = f => { const [fy,fm] = f.split('-').map(Number); return fy===y && (fm-1)===m; };

  const clasesMes = db.clases.filter(c=>enMes(c.fecha));
  const clasesDadas = clasesMes.filter(c=>claseYaOcurrida(c, ahora));
  const tpsMes = db.trabajos.filter(t=>enMes(t.fecha));

  const minutos = clasesDadas.reduce((s,c)=>s+(c.duracionMin||0),0) + tpsMes.reduce((s,t)=>s+(t.minutos||0),0);
  const montoClases = clasesDadas.reduce((s,c)=>s+Number(c.monto||0),0);
  const montoPasajes = clasesDadas.reduce((s,c)=>s+Number(c.viatico||0),0);
  const montoTPs = tpsMes.reduce((s,t)=>s+totalTrabajo(t),0);
  const generado = montoClases + montoPasajes + montoTPs;
  const cobradoMes = db.pagos.filter(p=>enMes(p.fecha)).reduce((s,p)=>s+Number(p.monto||0),0);
  const pendienteMes = clasesDadas.filter(c=>!c.pagada).reduce((s,c)=>s+totalClase(c),0) + tpsMes.filter(t=>!t.cobrado).reduce((s,t)=>s+totalTrabajo(t),0);
  const esperado = clasesMes.reduce((s,c)=>s+totalClase(c),0) + montoTPs;

  document.getElementById('statsHoras').textContent = fmt1(minutos/60) + ' h';
  document.getElementById('statsMonto').textContent = money(generado);
  document.getElementById('statsCobrado').textContent = money(cobradoMes);
  document.getElementById('statsPendiente').textContent = money(pendienteMes);
  const filaBd = (label, val) => `<div class="bd-row"><span>${label}</span><b>${money(val)}</b></div>`;
  document.getElementById('statsDesglose').innerHTML = generado>0
    ? filaBd(`Clases (${clasesDadas.length})`, montoClases) + (montoPasajes ? filaBd('Pasajes', montoPasajes) : '') + (tpsMes.length ? filaBd(`Trabajos prácticos (${tpsMes.length})`, montoTPs) : '')
    : '';
  const esperadoEl = document.getElementById('statsEsperado');
  esperadoEl.hidden = !(esperado > generado);
  esperadoEl.innerHTML = `${ic('info')}<span>Si dictás todas las clases agendadas, este mes generás <b>${money(esperado)}</b>.</span>`;

  renderHistorialPagos();

  document.getElementById('listaTrabajos').innerHTML = tpsMes.length ? tpsMes.sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(t=>`
    <div class="list-item tap" onclick="openTrabajoForm('${t.id}')">
      <div class="row-ic">${ic('file')}</div>
      <div class="item-main">
        <div class="item-title">${escapeHtml(t.titulo)}</div>
        <div class="item-sub">${escapeHtml(t.alumnoId ? alumnoNombre(t.alumnoId) : (t.cliente||''))} · ${formatDuracion(t.minutos||0)}</div>
      </div>
      <div class="item-right">
        ${money(totalTrabajo(t))}
        <div style="margin-top:3px;"><span class="badge ${t.cobrado?'pagada':'pendiente'}">${t.cobrado?'Cobrado':'Sin cobrar'}</span></div>
      </div>
    </div>`).join('') : '<div class="empty-msg" style="padding-bottom:14px;">Cargá los trabajos prácticos que hiciste y se suman a lo que generaste.</div>';

  const porAlumno = db.alumnos.map(a=>{
    const cs = clasesDadas.filter(c=>c.alumnoId===a.id);
    const ts = tpsMes.filter(t=>t.alumnoId===a.id);
    const h = (cs.reduce((s,c)=>s+(c.duracionMin||0),0) + ts.reduce((s,t)=>s+(t.minutos||0),0))/60;
    const mo = cs.reduce((s,c)=>s+totalClase(c),0) + ts.reduce((s,t)=>s+totalTrabajo(t),0);
    return {alumno:a, horas:h, monto:mo, cantidad:cs.length, tps:ts.length};
  }).filter(x=>x.cantidad>0 || x.tps>0).sort((a,b)=>b.monto-a.monto);

  document.getElementById('statsPorAlumno').innerHTML = porAlumno.length ? porAlumno.map(x=>`
    <div class="list-item tap" onclick="abrirDetalleAlumno('${x.alumno.id}')">
      ${avatarHtml(x.alumno,'sm')}
      <div class="item-main">
        <div class="item-title">${escapeHtml(x.alumno.nombre)}</div>
        <div class="item-sub">${x.cantidad} clase${x.cantidad!==1?'s':''}${x.tps?` · ${x.tps} TP`:''} · ${fmt1(x.horas)} h</div>
      </div>
      <div class="item-right">${money(x.monto)}</div>
    </div>
  `).join('') : '<div class="empty-msg" style="padding-bottom:14px;">Sin clases dadas este mes todavía.</div>';
}

function aplicarPaleta(){
  const paleta = db.config.paleta || 'terracota';
  document.documentElement.setAttribute('data-palette', paleta);
  try{ localStorage.setItem('estudiantes_palette_v1', paleta); }catch(e){}
  actualizarColorBarras();
}
// Las barras del sistema del celular (arriba y abajo) toman el color de theme-color.
// Antes quedaba fijo en el naranja de la paleta terracota: ahora sigue la paleta y el modo claro/oscuro.
function actualizarColorBarras(){
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if(!metaTheme) return;
  const color = getComputedStyle(document.documentElement).getPropertyValue('--card').trim();
  if(color) metaTheme.setAttribute('content', color);
}
if(window.matchMedia){
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  if(mq.addEventListener) mq.addEventListener('change', actualizarColorBarras);
}

function elegirPaleta(key){
  db.config.paleta = key;
  saveDB();
  try{ localStorage.setItem('estudiantes_palette_v1', key); }catch(e){}
  aplicarPaleta();
  renderThemeSwitch();
}

function renderThemeSwitch(){
  const cont = document.getElementById('themeSwitchAjustes');
  if(cont){
    const current = db.config.paleta || 'terracota';
    cont.innerHTML = PALETTES.map(p=>
      `<button type="button" class="${p.id===current?'active':''}" onclick="elegirPaleta('${p.id}')"><i style="background:${p.swatch}"></i>${p.label}</button>`
    ).join('');
  }
  const modo = document.getElementById('modoSwitchAjustes');
  if(modo){
    const tema = db.config.tema || 'auto';
    modo.innerHTML = [['auto','Automático'],['light','Claro'],['dark','Oscuro']].map(([v,l])=>
      `<button type="button" class="${tema===v?'active':''}" onclick="setTema('${v}'); renderThemeSwitch();">${l}</button>`).join('');
  }
}

const TEMA_ICONS = {auto:'🌓', light:'☀️', dark:'🌙'};
function aplicarModoOscuro(){
  const tema = db.config.tema || 'auto';

  else document.documentElement.setAttribute('data-theme', tema);

  db.config.tema = tema;

      if(!parsed || typeof parsed !== 'object') throw new Error('formato inválido');
      const ok = await confirmar({titulo:'¿Reemplazar tus datos?', mensaje:'Se reemplazan TODOS tus datos actuales por los del archivo.', ok:'Reemplazar', peligro:true});

/* =========================================================
   RESEÑAS
   Flujo sin servidor: le mandás al alumno/familia un link a review.html,
   completan estrellas + comentario y la reseña te llega por WhatsApp con un
   link que, al abrirlo, la guarda en la app.
   ========================================================= */
function b64urlEncode(obj){
  const json = JSON.stringify(obj);
  const b64 = btoa(unescape(encodeURIComponent(json)));
  return b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlDecode(str){
  let b64 = str.replace(/-/g,'+').replace(/_/g,'/');
  while(b64.length % 4) b64 += '=';
  return JSON.parse(decodeURIComponent(escape(atob(b64))));
}
function linkResena(alumno){
  const url = new URL('review.html', location.href);
  if(db.config.nombreProfe) url.searchParams.set('p', db.config.nombreProfe);
  if(db.config.telefonoProfe) url.searchParams.set('w', db.config.telefonoProfe);
  if(alumno){
    url.searchParams.set('a', alumno.nombre);
    if(alumno.nivel) url.searchParams.set('n', alumno.nivel);
  }
  url.searchParams.set('c', db.config.paleta || 'terracota');
  return url.toString();
}
function pedirResena(alumnoId){
  const a = getAlumno(alumnoId);
  if(!a) return;
  if(!db.config.telefonoProfe){
    showToast('Primero cargá tu WhatsApp para recibir las reseñas');
    abrirAjustesDatosProfe();
    return;
  }
  const saludo = a.tipo==='adulto' ? `¡Hola ${a.nombre}!` : (a.contacto ? `¡Hola ${a.contacto}!` : '¡Hola!');
  const sobre = a.tipo==='adulto' ? 'las clases' : `las clases con ${a.nombre}`;
  const firma = db.config.nombreProfe ? `\n${db.config.nombreProfe}` : '';
  const msg = `${saludo} ¿Me harías un favor? Si te gustaron ${sobre}, me ayudaría muchísimo que me dejes una reseña cortita (es 1 minuto) 🙏\n${linkResena(a)}\n\n¡Muchas gracias!${firma}`;
  window.open(waUrl(a.telefono, msg), '_blank');
  closeSheet();
}

function guardarResena(){

  const alumnoId = document.getElementById('f_rs_alumno').value || null;
  const alumno = alumnoId ? getAlumno(alumnoId) : null;
  db.resenas.push({
    id: uid(), alumnoId,
    alumnoNombre: alumno ? alumno.nombre : document.getElementById('f_rs_alumnoNombre').value,
    nivel: alumno ? alumno.nivel : document.getElementById('f_rs_nivel').value,
    autor: document.getElementById('f_rs_autor').value.trim(),
    relacion: document.getElementById('f_rs_relacion').value,
    estrellas: resenaEstrellasForm,
    texto,
    fecha: document.getElementById('f_rs_fecha').value || hoyIso(),
    publicar: document.getElementById('f_rs_publicar').checked
  });

  renderAll();
  abrirResenas();
  showToast('Reseña guardada ⭐');
}
// Si la app se abre desde el link que manda review.html (#resena=...), ofrecer guardarla
function revisarResenaEnLink(){
  const m = location.hash.match(/^#resena=(.+)$/);
  if(!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  try{
    const d = b64urlDecode(m[1]);
    const ya = db.resenas.some(r=>r.texto===d.t && r.autor===d.n);
    if(ya){ showToast('Esa reseña ya estaba guardada'); return; }
    abrirResenaManual({texto:d.t||'', autor:d.n||'', relacion:d.r||'', estrellas:Number(d.s)||5, alumnoNombre:d.a||'', nivel:d.l||'', publicar:d.p!==false, fecha:d.f||hoyIso()});
  }catch(e){
    showToast('No se pudo leer la reseña del link');
  }
}

const TUTORIAL_PASOS = [
  {icon:'sparkles', titulo:'Bienvenido/a a EstudiAntes', desc:'Tus clases particulares en un solo lugar: alumnos, agenda, cobros y tareas. Movete con la barra de abajo.'},
  {icon:'users', titulo:'Cargá tus alumnos', desc:'Tarifa, nivel, si viene a tu casa o vas vos (se suman 2 pasajes) y los temas que le tenés que dar.'},
  {icon:'calendar', titulo:'Tu semana de un vistazo', desc:'Lo verde es tiempo libre: tocalo para agendar una clase ahí. También podés compartir tus horarios libres por WhatsApp.'},
  {icon:'wallet', titulo:'Cobrá sin olvidarte', desc:'En Billetera ves quién te debe, registrás pagos y sumás los trabajos prácticos que hiciste.'},
  {icon:'star', titulo:'Juntá reseñas', desc:'Pedile a las familias una reseña con un toque y usala en tu CV o redes. Todo lo configurás desde el botón de ajustes, arriba a la derecha.'}
];
let tutorialPasoActual = 0;

function mostrarTutorial(){
  tutorialPasoActual = 0;
  renderTutorialPaso();
  document.getElementById('tutorialOverlay').classList.add('show');
}

function renderTutorialPaso(){
  const paso = TUTORIAL_PASOS[tutorialPasoActual];
  document.getElementById('tutorialIcon').innerHTML = ic(paso.icon);
  document.getElementById('tutorialTitle').textContent = paso.titulo;
  document.getElementById('tutorialDesc').textContent = paso.desc;
  document.getElementById('tutorialDots').innerHTML = TUTORIAL_PASOS.map((_,i)=>
    `<div class="tutorial-dot ${i===tutorialPasoActual?'active':''}"></div>`
  ).join('');
  document.getElementById('tutorialBackBtn').style.visibility = tutorialPasoActual===0 ? 'hidden' : 'visible';
  document.getElementById('tutorialNextBtn').textContent = tutorialPasoActual===TUTORIAL_PASOS.length-1 ? 'Empezar' : 'Siguiente';
}

function tutorialPaso(dir){
  if(dir>0 && tutorialPasoActual===TUTORIAL_PASOS.length-1){ cerrarTutorial(); return; }
  tutorialPasoActual = Math.min(TUTORIAL_PASOS.length-1, Math.max(0, tutorialPasoActual+dir));
  renderTutorialPaso();
}

function cerrarTutorial(){
  document.getElementById('tutorialOverlay').classList.remove('show');
  db.config.tutorialVisto = true;
  saveDB();
}

<!-- =========================================================
     FIREBASE: autenticación con Google + respaldo en Firestore
     Puente hacia el script principal vía funciones en window,
     porque los scripts type="module" no exponen sus funciones
     globalmente como sí lo hacen los scripts clásicos.
     ========================================================= -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAl5o1vUrtHjP8-3w6yHW-EKIP5LovnN20",
    authDomain: "estudiantes-f678f.firebaseapp.com",
    projectId: "estudiantes-f678f",
    storageBucket: "estudiantes-f678f.firebasestorage.app",
    messagingSenderId: "238962199371",
    appId: "1:238962199371:web:b4e47177df5d300e25b6ce"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const auth = getAuth(firebaseApp);
  const firestore = getFirestore(firebaseApp);
  const googleProvider = new GoogleAuthProvider();

  window.firebaseSignIn = function(){
    return signInWithPopup(auth, googleProvider).catch(err=>{
      console.error('Error al iniciar sesión con Google', err);
      if(window.showToast) window.showToast('No se pudo iniciar sesión');
    });
  };

  window.firebaseSignOutUser = function(){
    return signOut(auth);
  };

  window.firebaseFetchUserDoc = async function(uid){
    const snap = await getDoc(doc(firestore, 'users', uid));
    return snap.exists() ? snap.data() : null;
  };

  let guardadoPendiente = null;
  window.firebaseQueueSave = function(data){
    if(!auth.currentUser) return;
    clearTimeout(guardadoPendiente);
    guardadoPendiente = setTimeout(()=>{
      const copia = JSON.parse(JSON.stringify(data));
      setDoc(doc(firestore, 'users', auth.currentUser.uid), copia)
        .catch(err=>console.error('Error guardando en la nube', err));
    }, 800);
  };

  onAuthStateChanged(auth, (user)=>{
    if(window.onFirebaseAuthChange) window.onFirebaseAuthChange(user);
  });
</script>
