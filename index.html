<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#c1683d">
<title>estudiAntes</title>
<style>
  :root{
    --bg:#f8f1e6;
    --card:#fffaf2;
    --text:#3d2f26;
    --text-dim:#8c7a6b;
    --primary:#c1683d;
    --primary-dark:#9c522e;
    --danger:#b3453a;
    --danger-bg:#f8e1da;
    --ok:#6f8f51;
    --ok-bg:#e8f0dc;
    --warn:#c2872b;
    --warn-bg:#faead0;
    --border:#e9dcc7;
    --radius:18px;
    --font-agenda:Georgia,'Iowan Old Style','Palatino Linotype',serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:calc(72px + var(--safe-bottom));
    min-height:100vh;
  }
  header.topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;
    padding:16px 18px;
    display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 3px 12px rgba(120,70,30,.22);
  }
  header.topbar h1{font-family:var(--font-agenda);font-size:20px;margin:0;font-weight:700;letter-spacing:.2px;}
  header.topbar .icon-btn{
    background:rgba(255,255,255,.18);
    border:none;color:#fff;
    width:38px;height:38px;border-radius:12px;
    font-size:18px;display:flex;align-items:center;justify-content:center;
  }
  main{padding:14px;max-width:640px;margin:0 auto;}
  section.view{display:none;}
  section.view.active{display:block;animation:fadein .15s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .card{
    background:var(--card);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
    box-shadow:0 3px 14px rgba(120,80,40,.08);
    border:1px solid var(--border);
  }
  .card h2{margin:0 0 10px;font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;font-weight:700;}
  .card h2 .count{
    background:var(--primary);color:#fff;border-radius:20px;
    padding:1px 9px;font-size:12px;margin-left:6px;
  }
  .empty-msg{color:var(--text-dim);font-size:14px;padding:8px 2px;}

  .next-class-card{
    background:linear-gradient(135deg,#fff2df,#ffe3c4);
    border:1px solid #f0d6ab;
    border-radius:20px;
    padding:16px 18px;
    margin-bottom:14px;
    box-shadow:0 4px 16px rgba(160,100,40,.14);
  }
  .next-class-eyebrow{font-size:12px;font-weight:700;color:var(--primary-dark);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;}
  .next-class-countdown{font-family:var(--font-agenda);font-size:26px;font-weight:700;color:#7a3d1c;margin-bottom:6px;}
  .next-class-info{font-size:14px;color:var(--text);display:flex;align-items:center;gap:6px;}
  .next-class-info .dot{width:10px;height:10px;}

  .stats-esperado{
    background:#fff6e9;border:1px dashed var(--border);border-radius:14px;
    padding:10px 14px;font-size:13px;color:var(--text-dim);margin-bottom:12px;
  }
  .stats-esperado b{color:var(--text);}

  .stat-row{display:flex;gap:10px;margin-bottom:12px;}
  .stat-box{
    flex:1;background:var(--card);border-radius:var(--radius);
    padding:14px 10px;text-align:center;border:1px solid var(--border);
  }
  .stat-box .num{font-size:22px;font-weight:800;}
  .stat-box .label{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .stat-box.warn .num{color:var(--warn);}
  .stat-box.ok .num{color:var(--ok);}

  .list-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 4px;border-bottom:1px solid var(--border);
  }
  .list-item:last-child{border-bottom:none;}
  .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .item-main{flex:1;min-width:0;}
  .item-title{font-weight:600;font-size:15px;}
  .item-sub{font-size:13px;color:var(--text-dim);margin-top:1px;}
  .item-right{text-align:right;font-size:14px;font-weight:700;white-space:nowrap;}

  .badge{
    display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;
  }
  .badge.pendiente{background:var(--warn-bg);color:var(--warn);}
  .badge.pagada{background:var(--ok-bg);color:var(--ok);}

  nav.bottomnav{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    background:var(--card);border-top:1px solid var(--border);
    display:flex;
    padding-bottom:var(--safe-bottom);
    box-shadow:0 -2px 12px rgba(120,80,40,.08);
  }
  nav.bottomnav button{
    flex:1;background:none;border:none;
    padding:9px 2px 8px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--text-dim);font-size:11px;font-weight:600;
  }
  nav.bottomnav button .ic{font-size:20px;}
  nav.bottomnav button.active{color:var(--primary);}

  .fab{
    position:fixed;right:18px;bottom:calc(84px + var(--safe-bottom));z-index:15;
    width:58px;height:58px;border-radius:50%;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;
    font-size:28px;box-shadow:0 4px 14px rgba(160,90,40,.4);
    display:flex;align-items:center;justify-content:center;
    line-height:0;
  }
  .fab:active{background:var(--primary-dark);}

  .filter-row{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
  .filter-chip{
    flex-shrink:0;padding:8px 14px;border-radius:20px;border:1px solid var(--border);
    background:var(--card);font-size:13px;font-weight:600;color:var(--text-dim);white-space:nowrap;
  }
  .filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  /* bottom sheet modal */
  .overlay{
    position:fixed;inset:0;background:rgba(50,30,15,.45);z-index:50;
    display:none;align-items:flex-end;justify-content:center;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--card);width:100%;max-width:640px;
    border-radius:22px 22px 0 0;
    padding:16px 16px calc(20px + var(--safe-bottom));
    max-height:88vh;overflow-y:auto;
    animation:slideup .18s ease;
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
  .sheet-handle{width:40px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 12px;}
  .sheet h3{font-family:var(--font-agenda);margin:0 0 14px;font-size:19px;color:var(--primary-dark);}

  label{display:block;font-size:13px;font-weight:600;color:var(--text-dim);margin:12px 0 5px;}
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
    width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;
    font-size:15px;background:#fdf9f2;color:var(--text);font-family:inherit;
  }
  textarea{resize:vertical;min-height:60px;}
  input[type=color]{width:44px;height:36px;border:1px solid var(--border);border-radius:8px;padding:2px;background:var(--card);}

  .swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;}
  .swatch.sel{border-color:var(--text);}

  .row2{display:flex;gap:10px;}
  .row2 > *{flex:1;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:12px 16px;border-radius:14px;border:none;font-size:15px;font-weight:700;
    width:100%;margin-top:16px;
  }
  .btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;}
  .btn.primary:active{background:var(--primary-dark);}
  .btn.secondary{background:#f1e6d5;color:var(--text);}
  .btn.danger{background:var(--danger-bg);color:var(--danger);}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{margin-top:16px;}

  .checkbox-line{display:flex;align-items:center;gap:10px;padding:10px 0;}
  .checkbox-line input[type=checkbox]{width:22px;height:22px;flex-shrink:0;}
  .checkbox-line span{font-size:15px;}
  .checkbox-line.done span{text-decoration:line-through;color:var(--text-dim);}

  .toggle-pill{
    border:none;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;flex-shrink:0;
  }
  .toggle-pill.pendiente{background:var(--warn-bg);color:var(--warn);}
  .toggle-pill.pagada{background:var(--ok-bg);color:var(--ok);}

  .toast{
    position:fixed;left:50%;bottom:calc(90px + var(--safe-bottom));transform:translateX(-50%);
    background:#3d2f26;color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;
    z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .toast.show{opacity:1;}

  .section-actions{display:flex;gap:8px;margin-bottom:12px;}
  .section-actions .btn{margin-top:0;flex:1;padding:10px;font-size:13px;}

  .btn.whatsapp{background:#25D366;color:#fff;}
  .btn.whatsapp:active{background:#1ea952;}
  .duracion-display{font-size:13px;color:var(--text-dim);margin:4px 0 2px;min-height:16px;}

  .recurrencia-box{border-top:1px dashed var(--border);margin-top:16px;padding-top:6px;}

  .stats-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .stats-nav button{background:#f1e6d5;border:none;border-radius:10px;width:40px;height:40px;font-size:18px;font-weight:700;color:var(--text);}
  .stats-nav .stats-label{font-family:var(--font-agenda);font-weight:700;font-size:16px;text-transform:capitalize;color:var(--primary-dark);}

  .serie-tag{font-size:11px;color:var(--primary);margin-right:4px;}

  .tipo-option{
    flex:1;display:flex;align-items:flex-start;gap:8px;
    background:#fdf9f2;border:1px solid var(--border);border-radius:10px;
    padding:10px;font-size:13px;font-weight:600;
  }
  .tipo-option input{margin-top:2px;width:18px;height:18px;flex-shrink:0;}
  .tipo-option small{font-weight:400;color:var(--text-dim);}
  .tipo-option.sel{border-color:var(--primary);background:#fbeee1;}

  .dias-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .dia-chip{
    padding:8px 10px;border-radius:20px;border:1px solid var(--border);
    background:var(--card);font-size:12px;font-weight:700;color:var(--text-dim);
  }
  .dia-chip input{display:none;}
  .dia-chip.sel{background:var(--primary);color:#fff;border-color:var(--primary);}
</style>
</head>
<body>

<header class="topbar">
  <h1 id="pageTitle">estudiAntes</h1>
  <button class="icon-btn" onclick="openSettings()" aria-label="Ajustes">⚙️</button>
</header>

<main>

  <!-- DASHBOARD -->
  <section class="view active" id="view-dashboard">
    <div class="next-class-card" id="nextClassCard" hidden>
      <div class="next-class-eyebrow">⏳ Tu próxima clase</div>
      <div class="next-class-countdown" id="nextClassCountdown">—</div>
      <div class="next-class-info">
        <span class="dot" id="nextClassDot"></span>
        con <b id="nextClassAlumno"></b> · <span id="nextClassCuando"></span>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-box warn">
        <div class="num" id="statPendienteMonto">$0</div>
        <div class="label">Total pendiente</div>
      </div>
      <div class="stat-box">
        <div class="num" id="statProximas">0</div>
        <div class="label">Clases esta semana</div>
      </div>
      <div class="stat-box">
        <div class="num" id="statTareas">0</div>
        <div class="label">Tareas pendientes</div>
      </div>
    </div>

    <div class="card">
      <h2 id="dashProximasTitulo">Próximas clases</h2>
      <div id="dashProximas"></div>
    </div>

    <div class="card">
      <h2>Alumnos con pagos pendientes</h2>
      <div id="dashPendientes"></div>
    </div>

    <div class="card">
      <h2>Material sin preparar</h2>
      <div id="dashTareas"></div>
    </div>
  </section>

  <!-- ALUMNOS -->
  <section class="view" id="view-alumnos">
    <div id="listaAlumnos"></div>
  </section>

  <!-- CLASES -->
  <section class="view" id="view-clases">
    <div class="filter-row" id="filtroAlumnoClases"></div>
    <div class="section-actions">
      <button class="btn secondary" onclick="marcarTodasPagadas()">✓ Marcar filtradas como pagadas</button>
    </div>
    <div id="listaClases"></div>
  </section>

  <!-- TAREAS -->
  <section class="view" id="view-tareas">
    <div class="filter-row" id="filtroAlumnoTareas"></div>
    <div id="listaTareas"></div>
  </section>

  <!-- ESTADÍSTICAS -->
  <section class="view" id="view-stats">
    <div class="stats-nav">
      <button onclick="cambiarMesStats(-1)" aria-label="Mes anterior">←</button>
      <div class="stats-label" id="statsMesLabel"></div>
      <button onclick="cambiarMesStats(1)" aria-label="Mes siguiente">→</button>
    </div>
    <div class="stat-row">
      <div class="stat-box">
        <div class="num" id="statsHoras">0</div>
        <div class="label">Horas dadas</div>
      </div>
      <div class="stat-box">
        <div class="num" id="statsMonto">$0</div>
        <div class="label">Monto dado</div>
      </div>
    </div>
    <div class="stat-row">
      <div class="stat-box ok">
        <div class="num" id="statsCobrado">$0</div>
        <div class="label">Cobrado</div>
      </div>
      <div class="stat-box warn">
        <div class="num" id="statsPendiente">$0</div>
        <div class="label">Pendiente</div>
      </div>
    </div>
    <div class="stats-esperado" id="statsEsperado"></div>
    <div class="card">
      <h2>Por alumno este mes (dado)</h2>
      <div id="statsPorAlumno"></div>
    </div>
  </section>

</main>

<button class="fab" id="fabBtn">+</button>

<nav class="bottomnav">
  <button data-view="dashboard" class="active"><span class="ic">🏠</span>Inicio</button>
  <button data-view="alumnos"><span class="ic">👤</span>Alumnos</button>
  <button data-view="clases"><span class="ic">📅</span>Clases</button>
  <button data-view="tareas"><span class="ic">📝</span>Tareas</button>
  <button data-view="stats"><span class="ic">📊</span>Stats</button>
</nav>

<!-- overlay / bottom sheet -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheetContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ESTRUCTURA DE DATOS
   ========================================================= */
const STORAGE_KEY = 'estudiantes_app_data_v1';

let db = {
  alumnos: [],  // {id, nombre, tarifa, color, contacto, activo}
  clases:  [],  // {id, serieId|null, alumnoId, fecha:'YYYY-MM-DD', horaEntrada:'HH:MM', horaSalida:'HH:MM'|null, duracionMin, monto, pagada, notas}
  tareas:  [],  // {id, alumnoId|null, claseId|null, texto, hecha}
  config:  {tarifaMin:7000, tarifaMax:15000}
};

function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      db.alumnos = parsed.alumnos || [];
      db.clases = parsed.clases || [];
      db.tareas = parsed.tareas || [];
      db.config = Object.assign({tarifaMin:7000, tarifaMax:15000}, parsed.config||{});
    }
    // migración de clases con el esquema viejo (hora + duracionMin -> horaEntrada/horaSalida)
    db.clases.forEach(c=>{
      if(!c.horaEntrada && c.hora){
        c.horaEntrada = c.hora;
        c.horaSalida = c.duracionMin ? sumarMinutos(c.hora, c.duracionMin) : null;
        delete c.hora;
      }
      if(c.serieId===undefined) c.serieId = null;
    });
    // migración de alumnos sin tipo definido: antes todo el mundo se trataba como "niño" (mensaje al contacto)
    db.alumnos.forEach(a=>{
      if(!a.tipo) a.tipo = 'nino';
    });
  }catch(e){
    console.error('Error leyendo datos', e);
  }
}

function saveDB(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}

/* helpers de acceso */
function getAlumno(id){ return db.alumnos.find(a => a.id === id); }
function alumnoNombre(id){ const a = getAlumno(id); return a ? a.nombre : '(alumno eliminado)'; }
function alumnoColor(id){ const a = getAlumno(id); return a ? a.color : '#999'; }

const COLOR_SWATCHES = ['#ef4444','#f97316','#f59e0b','#84cc16','#22c55e','#14b8a6','#06b6d4','#3b82f6','#6366f1','#a855f7','#ec4899','#78716c'];

/* =========================================================
   NAVEGACIÓN
   ========================================================= */
const views = ['dashboard','alumnos','clases','tareas','stats'];
const titles = {dashboard:'estudiAntes', alumnos:'Alumnos', clases:'Clases', tareas:'Material a preparar', stats:'Estadísticas'};

function goTo(view){
  views.forEach(v=>{
    document.getElementById('view-'+v).classList.toggle('active', v===view);
  });
  document.querySelectorAll('.bottomnav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===view);
  });
  document.getElementById('pageTitle').textContent = titles[view];
  document.getElementById('fabBtn').style.display = (view==='dashboard'||view==='stats') ? 'none' : 'flex';
  renderAll();
}

document.querySelectorAll('.bottomnav button').forEach(b=>{
  b.addEventListener('click', ()=>goTo(b.dataset.view));
});

document.getElementById('fabBtn').addEventListener('click', ()=>{
  const active = document.querySelector('.bottomnav button.active').dataset.view;
  if(active==='alumnos') openAlumnoForm();
  if(active==='clases') openClaseForm();
  if(active==='tareas') openTareaForm();
});

/* =========================================================
   BOTTOM SHEET GENÉRICO
   ========================================================= */
const overlay = document.getElementById('overlay');
const sheetContent = document.getElementById('sheetContent');

function openSheet(html){
  sheetContent.innerHTML = '<div class="sheet-handle"></div>' + html;
  overlay.classList.add('show');
}
function closeSheet(){
  overlay.classList.remove('show');
  sheetContent.innerHTML = '';
}
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeSheet(); });

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function money(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtFecha(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function fechaHoraClase(c){
  return new Date(`${c.fecha}T${c.horaEntrada||'00:00'}`);
}
function sumarMinutos(horaStr, minutos){
  const [h,m] = horaStr.split(':').map(Number);
  const total = h*60+m+minutos;
  const hh = Math.floor(total/60)%24, mm = total%60;
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}
function diffMinutos(horaA, horaB){
  const [ha,ma] = horaA.split(':').map(Number);
  const [hb,mb] = horaB.split(':').map(Number);
  return (hb*60+mb) - (ha*60+ma);
}
function formatDuracion(min){
  const h = Math.floor(min/60), m = min%60;
  return `${h>0?h+'h ':''}${m>0?m+'m':''}`.trim() || '0m';
}
function formatDuracionTexto(min){
  const h = Math.floor(min/60), m = min%60;
  const parts = [];
  if(h>0) parts.push(`${h} ${h===1?'hora':'horas'}`);
  if(m>0) parts.push(`${m} minutos`);
  return parts.length ? parts.join(' y ') : '0 minutos';
}
const MINUTOS_OPCIONES = ['00','15','30','45'];
function opcionesHoras(min, max, selected){
  let html = '';
  for(let h=min; h<=max; h++){
    const hh = String(h).padStart(2,'0');
    html += `<option value="${hh}" ${hh===selected?'selected':''}>${hh}</option>`;
  }
  return html;
}
function opcionesMinutos(selected){
  return MINUTOS_OPCIONES.map(m=>`<option value="${m}" ${m===selected?'selected':''}>${m}</option>`).join('');
}
function leerHora(idHora, idMinuto){
  const h = document.getElementById(idHora).value;
  if(!h) return null;
  const m = document.getElementById(idMinuto).value;
  return h + ':' + m;
}
function getMonday(d){
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day===0 ? -6 : 1-day);
  date.setDate(date.getDate()+diff);
  date.setHours(0,0,0,0);
  return date;
}
function getSunday(monday){
  const s = new Date(monday);
  s.setDate(s.getDate()+6);

function esMesActual(fechaStr){
  const [y,m] = fechaStr.split('-').map(Number);
  const hoy = new Date();
  return y===hoy.getFullYear() && (m-1)===hoy.getMonth();
}

function sumaPendienteMesActual(alumnoId, hoySinHora){
  return db.clases
    .filter(c=>{
      if(c.alumnoId!==alumnoId || c.pagada || !esMesActual(c.fecha)) return false;
      return new Date(c.fecha+'T00:00:00') < hoySinHora;
    })
    .reduce((s,c)=>s+Number(c.monto||0),0);
}

function nombreDiaFecha(fechaStr){
  const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const f = new Date(fechaStr+'T00:00:00');
  return `${dias[f.getDay()]} ${f.getDate()}`;
}

function guardarClase(id){
  const alumnoId = document.getElementById('f_alumnoId').value;
  const fecha = document.getElementById('f_fecha').value;
  const horaEntrada = leerHora('f_horaEntradaH','f_horaEntradaM');
  const horaSalida = leerHora('f_horaSalidaH','f_horaSalidaM');
  const monto = parseFloat(document.getElementById('f_monto').value)||0;
  const notas = document.getElementById('f_notas').value.trim();
  const pagada = document.getElementById('f_pagada').checked;

  if(!alumnoId){ showToast('Elegí un alumno'); return; }
  if(!fecha){ showToast('Elegí una fecha'); return; }

  let duracionMin = 0;
  if(horaSalida){
    duracionMin = diffMinutos(horaEntrada, horaSalida);
    if(duracionMin<=0){ showToast('La hora de salida debe ser posterior a la de entrada'); return; }
  }

  if(id){
    const c = db.clases.find(c=>c.id===id);
    Object.assign(c, {alumnoId, fecha, horaEntrada, horaSalida: horaSalida||null, duracionMin, monto, notas, pagada});
    saveDB();
    closeSheet();
    renderAll();
    showToast('Clase guardada');
    return;
  }

  const recurrenteChk = document.getElementById('f_recurrente');
  if(recurrenteChk && recurrenteChk.checked){
    const frecuencia = document.getElementById('f_frecuencia').value;
    const duracionValor = parseInt(document.getElementById('f_duracionValor').value)||1;
    const duracionUnidad = document.getElementById('f_duracionUnidad').value;
    let diasSemana = [];
    if(frecuencia==='semanal'){
      diasSemana = Array.from(document.querySelectorAll('#diasSemanaChips input:checked')).map(el=>parseInt(el.value));
      if(diasSemana.length===0){ showToast('Elegí al menos un día de la semana'); return; }
    }
    const fechas = generarFechasRecurrencia(fecha, frecuencia, duracionValor, duracionUnidad, diasSemana);
    const serieId = uid();
    fechas.forEach(f=>{
      db.clases.push({id: uid(), serieId, alumnoId, fecha:f, horaEntrada, horaSalida: horaSalida||null, duracionMin, monto, notas, pagada:false});
    });
    saveDB();
    closeSheet();
    renderAll();
    showToast(`Se crearon ${fechas.length} clases`);
    return;
  }

  db.clases.push({id: uid(), serieId:null, alumnoId, fecha, horaEntrada, horaSalida: horaSalida||null, duracionMin, monto, notas, pagada});
  saveDB();
  closeSheet();
  renderAll();
  showToast('Clase guardada');
}

function generarFechasRecurrencia(fechaInicioStr, frecuencia, duracionValor, duracionUnidad, diasSemana){
  const fechas = [];
  const inicio = new Date(fechaInicioStr+'T00:00:00');
  const finLimite = new Date(inicio);
  if(duracionUnidad==='semanas') finLimite.setDate(finLimite.getDate()+duracionValor*7);
  else finLimite.setMonth(finLimite.getMonth()+duracionValor);

  if(frecuencia==='semanal' && diasSemana && diasSemana.length){
    let cur = new Date(inicio);
    while(cur <= finLimite){
      if(diasSemana.includes(cur.getDay())){
        fechas.push(cur.toISOString().slice(0,10));
      }
      cur.setDate(cur.getDate()+1);
    }
    return fechas;
  }

  const incrementar = (d)=>{
    const nd = new Date(d);
    if(frecuencia==='quincenal') nd.setDate(nd.getDate()+14);
    else if(frecuencia==='mensual') nd.setMonth(nd.getMonth()+1);
    return nd;
  };

  let cur = new Date(inicio);
  while(cur <= finLimite){
    fechas.push(cur.toISOString().slice(0,10));
    cur = incrementar(cur);
  }
  return fechas;
}

    <select id="f_t_alumnoId">${opciones}</select>

    <label>Descripción</label>
    <textarea id="f_t_texto" placeholder="Ej: preparar ejercicios de escalas...">${editing ? escapeHtml(editing.texto) : ''}</textarea>

    <div class="btn-row">
      ${editing ? `<button class="btn danger" onclick="eliminarTarea('${editing.id}')">Eliminar</button>` : ''}
      <button class="btn primary" onclick="guardarTarea(${editing ? `'${editing.id}'` : 'null'})">Guardar</button>
    </div>
  `);
}

function guardarTarea(id){
  const alumnoId = document.getElementById('f_t_alumnoId').value || null;
  const texto = document.getElementById('f_t_texto').value.trim();
  if(!texto){ showToast('Escribí una descripción'); return; }

  if(id){
    const t = db.tareas.find(t=>t.id===id);
    t.alumnoId = alumnoId; t.texto = texto;
  }else{
    db.tareas.push({id: uid(), alumnoId, claseId:null, texto, hecha:false});
  }
  saveDB();
  closeSheet();
  renderAll();
  showToast('Tarea guardada');
}

function eliminarTarea(id){
  if(!confirm('¿Eliminar esta tarea?')) return;
  db.tareas = db.tareas.filter(t=>t.id!==id);
  saveDB();
  closeSheet();
  renderAll();
  showToast('Tarea eliminada');
}

function toggleTarea(id, ev){
  if(ev) ev.stopPropagation();
  const t = db.tareas.find(t=>t.id===id);
  t.hecha = !t.hecha;
  saveDB();
  renderAll();
}

function renderFiltroTareas(){
  const cont = document.getElementById('filtroAlumnoTareas');
  let chips = `<button class="filter-chip ${filtroTareasAlumno==='todos'?'active':''}" onclick="setFiltroTareas('todos')">Todos</button>`;
  chips += db.alumnos.map(a=>`<button class="filter-chip ${filtroTareasAlumno===a.id?'active':''}" onclick="setFiltroTareas('${a.id}')">${escapeHtml(a.nombre)}</button>`).join('');
  cont.innerHTML = chips;
}
function setFiltroTareas(v){ filtroTareasAlumno = v; renderAll(); }

function renderTareas(){
  renderFiltroTareas();
  const cont = document.getElementById('listaTareas');
  let lista = db.tareas.slice();
  if(filtroTareasAlumno!=='todos') lista = lista.filter(t=>t.alumnoId===filtroTareasAlumno);
  lista.sort((a,b)=> (a.hecha - b.hecha)); // pendientes primero

  if(lista.length===0){
    cont.innerHTML = '<div class="card"><div class="empty-msg">No hay tareas cargadas. Tocá + para agregar una.</div></div>';
    return;
  }

  cont.innerHTML = '<div class="card">' + lista.map(t=>`
    <div class="checkbox-line ${t.hecha?'done':''}" style="border-bottom:1px solid var(--border);">
      <input type="checkbox" ${t.hecha?'checked':''} onclick="toggleTarea('${t.id}', event)">
      <span onclick="openTareaForm('${t.id}')" style="flex:1;">
        ${t.alumnoId ? `<b>${escapeHtml(alumnoNombre(t.alumnoId))}:</b> `:''}${escapeHtml(t.texto)}
      </span>
    </div>
  `).join('') + '</div>';
}

/* =========================================================
   DASHBOARD
   ========================================================= */
function formatCuentaRegresiva(ms){
  if(ms<=0) return '¡Es ahora!';
  const totalMin = Math.round(ms/60000);
  const dias = Math.floor(totalMin/1440);
  const horas = Math.floor((totalMin%1440)/60);
  const mins = totalMin%60;
  if(dias>0) return `${dias} día${dias!==1?'s':''} y ${horas} hora${horas!==1?'s':''}`;
  if(horas>0) return `${horas} hora${horas!==1?'s':''} y ${mins} min`;
  return `${mins} min`;
}

function renderProximaClaseCountdown(c, ahora){
  const card = document.getElementById('nextClassCard');
  if(!c){ card.hidden = true; return; }
  card.hidden = false;
  document.getElementById('nextClassCountdown').textContent = formatCuentaRegresiva(fechaHoraClase(c)-ahora);
  document.getElementById('nextClassAlumno').textContent = alumnoNombre(c.alumnoId);
  document.getElementById('nextClassDot').style.background = alumnoColor(c.alumnoId);
  document.getElementById('nextClassCuando').textContent = `${nombreDiaFecha(c.fecha)} · ${c.horaEntrada}`;
}

function renderDashboard(){
  const ahora = new Date();
  const hoySinHora = new Date(ahora);
  hoySinHora.setHours(0,0,0,0);

  // Próximas clases (futuras, orden ascendente)
  const proximas = db.clases
    .filter(c => fechaHoraClase(c) >= ahora)
    .sort((a,b)=> fechaHoraClase(a) - fechaHoraClase(b))
    .slice(0,5);

  renderProximaClaseCountdown(proximas[0], ahora);

  const nombreMes = ahora.toLocaleDateString('es-AR', {month:'long'});
  document.getElementById('dashProximasTitulo').textContent =
    `Próximas clases - ${nombreMes.charAt(0).toUpperCase()+nombreMes.slice(1)}`;

  const monday = getMonday(ahora);
  const sunday = getSunday(monday);
  const clasesEstaSemana = db.clases.filter(c=>{
    const f = new Date(c.fecha+'T00:00:00');
    return f>=monday && f<=sunday;
  }).length;
  document.getElementById('statProximas').textContent = clasesEstaSemana;

  const proxCont = document.getElementById('dashProximas');
  proxCont.innerHTML = proximas.length ? proximas.map(c=>{
    const rangoHora = c.horaEntrada + (c.horaSalida ? '-'+c.horaSalida : '');
    return `
    <div class="list-item" onclick="goTo('clases')" style="cursor:pointer;">
      <div class="dot" style="background:${alumnoColor(c.alumnoId)}"></div>
      <div class="item-main">
        <div class="item-title">${c.serieId ? '<span class="serie-tag">🔁</span>' : ''}${escapeHtml(alumnoNombre(c.alumnoId))}</div>
        <div class="item-sub">${nombreDiaFecha(c.fecha)} · ${rangoHora}</div>
      </div>
      <div class="item-right">${money(c.monto)}</div>
    </div>`;
  }).join('') : '<div class="empty-msg">No hay clases próximas agendadas.</div>';

  // Pagos pendientes: solo clases de este mes que ya pasaron y siguen sin pagar
  const deudores = db.alumnos
    .map(a=>({alumno:a, deuda: sumaPendienteMesActual(a.id, hoySinHora)}))
    .filter(x=>x.deuda>0)
    .sort((a,b)=>b.deuda-a.deuda);

  const totalPendiente = deudores.reduce((s,x)=>s+x.deuda,0);
  document.getElementById('statPendienteMonto').textContent = money(totalPendiente);

  const pendCont = document.getElementById('dashPendientes');
  pendCont.innerHTML = deudores.length ? deudores.map(x=>`
    <div class="list-item" onclick="setFiltroClases('${x.alumno.id}'); goTo('clases');" style="cursor:pointer;">
      <div class="dot" style="background:${x.alumno.color}"></div>
      <div class="item-main">
        <div class="item-title">${escapeHtml(x.alumno.nombre)}</div>
      </div>
      <div class="item-right" style="color:var(--warn);">${money(x.deuda)}</div>
    </div>
  `).join('') : '<div class="empty-msg">Ningún alumno tiene pagos pendientes 🎉</div>';

  // Tareas pendientes
  const tareasPend = db.tareas.filter(t=>!t.hecha);
  document.getElementById('statTareas').textContent = tareasPend.length;

  const tareasCont = document.getElementById('dashTareas');
  tareasCont.innerHTML = tareasPend.length ? tareasPend.slice(0,6).map(t=>`
    <div class="checkbox-line" onclick="goTo('tareas')" style="cursor:pointer;">
      <input type="checkbox" onclick="toggleTarea('${t.id}', event)">
      <span>${t.alumnoId ? `<b>${escapeHtml(alumnoNombre(t.alumnoId))}:</b> `:''}${escapeHtml(t.texto)}</span>
    </div>
  `).join('') + (tareasPend.length>6 ? `<div class="empty-msg">y ${tareasPend.length-6} más...</div>` : '')
    : '<div class="empty-msg">No tenés material pendiente de preparar 🎉</div>';
}

/* =========================================================
   ESTADÍSTICAS
   ========================================================= */
let statsFecha = new Date();

function cambiarMesStats(delta){
  statsFecha.setMonth(statsFecha.getMonth()+delta);
  renderStats();
}

function claseYaOcurrida(c, ahora){
  const horaRef = c.horaSalida || c.horaEntrada;
  return new Date(`${c.fecha}T${horaRef}`) <= ahora;
}

function renderStats(){
  const ahora = new Date();
  const y = statsFecha.getFullYear(), m = statsFecha.getMonth();
  const label = statsFecha.toLocaleDateString('es-AR', {month:'long', year:'numeric'});
  document.getElementById('statsMesLabel').textContent = label.charAt(0).toUpperCase()+label.slice(1);

  const clasesMes = db.clases.filter(c=>{
    const [cy,cm] = c.fecha.split('-').map(Number);
    return cy===y && (cm-1)===m;
  });
  const clasesDadas = clasesMes.filter(c=>claseYaOcurrida(c, ahora));

  const horas = clasesDadas.reduce((s,c)=>s+(c.duracionMin||0),0)/60;
  const dado = clasesDadas.reduce((s,c)=>s+Number(c.monto||0),0);
  const esperado = clasesMes.reduce((s,c)=>s+Number(c.monto||0),0);
  const cobrado = clasesMes.filter(c=>c.pagada).reduce((s,c)=>s+Number(c.monto||0),0);
  const pendiente = Math.max(0, dado-cobrado);

  document.getElementById('statsHoras').textContent = horas.toLocaleString('es-AR',{maximumFractionDigits:1});
  document.getElementById('statsMonto').textContent = money(dado);
  document.getElementById('statsCobrado').textContent = money(cobrado);
  document.getElementById('statsPendiente').textContent = money(pendiente);
  document.getElementById('statsEsperado').innerHTML =
    `📅 Monto esperado este mes si dicto todas las clases programadas: <b>${money(esperado)}</b>`;

  const porAlumno = db.alumnos.map(a=>{
    const cs = clasesDadas.filter(c=>c.alumnoId===a.id);
    const h = cs.reduce((s,c)=>s+(c.duracionMin||0),0)/60;
    const mo = cs.reduce((s,c)=>s+Number(c.monto||0),0);
    return {alumno:a, horas:h, monto:mo, cantidad:cs.length};
  }).filter(x=>x.cantidad>0).sort((a,b)=>b.monto-a.monto);

  document.getElementById('statsPorAlumno').innerHTML = porAlumno.length ? porAlumno.map(x=>`
    <div class="list-item">
      <div class="dot" style="background:${x.alumno.color}"></div>
      <div class="item-main">
        <div class="item-title">${escapeHtml(x.alumno.nombre)}</div>
        <div class="item-sub">${x.cantidad} clase(s) · ${x.horas.toLocaleString('es-AR',{maximumFractionDigits:1})}h</div>
      </div>
      <div class="item-right">${money(x.monto)}</div>
    </div>
  `).join('') : '<div class="empty-msg">Sin clases dadas este mes todavía.</div>';
}

/* =========================================================
   RENDER GENERAL
   ========================================================= */
function renderAll(){
  renderDashboard();
  renderAlumnos();
  renderClases();
  renderTareas();
  renderStats();
}

/* =========================================================
   AJUSTES: EXPORTAR / IMPORTAR
   ========================================================= */
function openSettings(){
  openSheet(`
    <h3>Ajustes y respaldo</h3>
    <p style="color:var(--text-dim);font-size:14px;">Tus datos se guardan solo en este dispositivo (localStorage). Exportá un respaldo periódicamente por si cambiás de celular o borrás el navegador.</p>

    <button class="btn primary" onclick="exportarDatos()">⬇️ Exportar datos (JSON)</button>

    <label style="margin-top:18px;">Rango de tarifas (piso y techo del selector de precio)</label>
    <div class="row2">
      <input type="number" id="f_tarifaMin" value="${db.config.tarifaMin}" step="1000" min="0" inputmode="numeric">
      <input type="number" id="f_tarifaMax" value="${db.config.tarifaMax}" step="1000" min="0" inputmode="numeric">
    </div>
    <button class="btn secondary" onclick="guardarRangoTarifas()">Guardar rango de tarifas</button>

    <label style="margin-top:18px;">Importar datos desde archivo</label>
    <input type="file" id="importFile" accept="application/json,.json">
    <button class="btn secondary" onclick="importarDatos()">⬆️ Importar (reemplaza los datos actuales)</button>

    <div style="margin-top:18px;border-top:1px solid var(--border);padding-top:14px;">
      <div style="font-size:13px;color:var(--text-dim);">Alumnos: ${db.alumnos.length} · Clases: ${db.clases.length} · Tareas: ${db.tareas.length}</div>
    </div>

    <button class="btn danger" style="margin-top:18px;" onclick="borrarTodo()">🗑️ Borrar todos los datos</button>
  `);
}

function guardarRangoTarifas(){
  const min = parseInt(document.getElementById('f_tarifaMin').value)||7000;
  const max = parseInt(document.getElementById('f_tarifaMax').value)||15000;
  if(min>=max){ showToast('El piso debe ser menor que el techo'); return; }
  db.config.tarifaMin = min;
  db.config.tarifaMax = max;
  saveDB();
  showToast('Rango de tarifas actualizado');
}

function exportarDatos(){
  const data = JSON.stringify(db, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fecha = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `estudiantes_backup_${fecha}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Datos exportados');
}

function importarDatos(){
  const input = document.getElementById('importFile');
  const file = input.files[0];
  if(!file){ showToast('Elegí un archivo primero'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || typeof parsed !== 'object') throw new Error('formato inválido');
      if(!confirm('Esto reemplazará TODOS tus datos actuales. ¿Continuar?')) return;
      db.alumnos = Array.isArray(parsed.alumnos) ? parsed.alumnos : [];
      db.clases = Array.isArray(parsed.clases) ? parsed.clases : [];
      db.tareas = Array.isArray(parsed.tareas) ? parsed.tareas : [];
      db.config = Object.assign({tarifaMin:7000, tarifaMax:15000}, parsed.config||{});
      saveDB();
      closeSheet();
      renderAll();
      showToast('Datos importados correctamente');
    }catch(err){
      showToast('Archivo inválido');
    }
  };
  reader.readAsText(file);
}

function borrarTodo(){
  if(!confirm('Esto borra TODOS los alumnos, clases y tareas. ¿Estás seguro?')) return;
  if(!confirm('Última confirmación: se perderá todo lo que no hayas exportado. ¿Continuar?')) return;
  db.alumnos = []; db.clases = []; db.tareas = [];
  saveDB();
  closeSheet();
  renderAll();
  showToast('Datos borrados');
}

/* =========================================================
   INIT
   ========================================================= */
loadDB();
renderAll();
document.getElementById('fabBtn').style.display = 'none';

setInterval(()=>{
  if(document.getElementById('view-dashboard').classList.contains('active')) renderDashboard();
}, 60000);
</script>
