<!DOCTYPE html>
<html lang="es" data-palette="terracota">
<head>
<meta charset="UTF-8">
<script>
(function(){
  try {
    var p = localStorage.getItem('estudiantes_palette_v1');
    if (p) document.documentElement.setAttribute('data-palette', p);
    var t = localStorage.getItem('estudiantes_theme_v1');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#c1683d">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>EstudiAntes</title>
<style>
  :root{
    --radius:18px;
    --font-agenda:'Fraunces',Georgia,'Iowan Old Style','Palatino Linotype',serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --overlay-bg:rgba(50,30,15,.45);
  }

  /* Terracota */
  :root[data-palette="terracota"]{
    --bg:#faf3ea; --card:#ffffff; --text:#3a2b22; --text-dim:#8a7360; --border:#e8d8c3;
    --primary:#c1673b; --primary-dark:#a34f28;
    --ok:#6b8f4e; --ok-bg:#e8f0dd; --warn:#c98a2c; --warn-bg:#fbeed7; --danger:#c1453a; --danger-bg:#f8e1de;
    --input-bg:#f3e7d8; --btn-secondary-bg:#f3e7d8; --soft-tint-bg:#f3e7d8;
  }
  /* Salvia */
  :root[data-palette="salvia"]{
    --bg:#f4f6f1; --card:#ffffff; --text:#2b332a; --text-dim:#71806c; --border:#dbe4d3;
    --primary:#6f8f5c; --primary-dark:#556e46;
    --ok:#4f8f5e; --ok-bg:#e2f0e2; --warn:#b98a3a; --warn-bg:#f6ecd8; --danger:#b85c4d; --danger-bg:#f6e2dd;
    --input-bg:#e9efe2; --btn-secondary-bg:#e9efe2; --soft-tint-bg:#e9efe2;
  }
  /* Lavanda */
  :root[data-palette="lavanda"]{
    --bg:#f6f3f8; --card:#ffffff; --text:#322b3a; --text-dim:#7d7189; --border:#ddd2e6;
    --primary:#8067a8; --primary-dark:#6a5290;
    --ok:#5a9470; --ok-bg:#e2f0e7; --warn:#bd8a3f; --warn-bg:#f6edd9; --danger:#b3576b; --danger-bg:#f5e0e5;
    --input-bg:#ece5f1; --btn-secondary-bg:#ece5f1; --soft-tint-bg:#ece5f1;
  }

  @media (prefers-color-scheme: dark){
    :root[data-palette="terracota"]:not([data-theme="light"]){
      --bg:#211a15; --card:#2c2119; --text:#f1e4d6; --text-dim:#b6a08a; --border:#4a392c;
      --primary:#e08a5b; --primary-dark:#c1673b;
      --ok:#8fb96b; --ok-bg:#2c3a22; --warn:#e0aa53; --warn-bg:#3e2f14; --danger:#e0776a; --danger-bg:#3e211d;
      --input-bg:#382a1f; --btn-secondary-bg:#382a1f; --soft-tint-bg:#382a1f; --overlay-bg:rgba(0,0,0,.6);
    }
    :root[data-palette="salvia"]:not([data-theme="light"]){
      --bg:#171c15; --card:#212820; --text:#e6ede1; --text-dim:#a2b099; --border:#3a4535;
      --primary:#93b97e; --primary-dark:#6f8f5c;
      --ok:#7cbf87; --ok-bg:#223829; --warn:#d4a75d; --warn-bg:#3e3018; --danger:#d68a78; --danger-bg:#3e2622;
      --input-bg:#2a3327; --btn-secondary-bg:#2a3327; --soft-tint-bg:#2a3327; --overlay-bg:rgba(0,0,0,.6);
    }
    :root[data-palette="lavanda"]:not([data-theme="light"]){
      --bg:#1c1721; --card:#26202c; --text:#ece6f0; --text-dim:#ab9fb8; --border:#453a4f;
      --primary:#ab8ed4; --primary-dark:#8067a8;
      --ok:#7fbf96; --ok-bg:#223a2c; --warn:#d9ac60; --warn-bg:#3e2f16; --danger:#d98297; --danger-bg:#3e2028;
      --input-bg:#322a3a; --btn-secondary-bg:#322a3a; --soft-tint-bg:#322a3a; --overlay-bg:rgba(0,0,0,.6);
    }
  }
  :root[data-palette="terracota"][data-theme="dark"]{
    --bg:#211a15; --card:#2c2119; --text:#f1e4d6; --text-dim:#b6a08a; --border:#4a392c;
    --primary:#e08a5b; --primary-dark:#c1673b;
    --ok:#8fb96b; --ok-bg:#2c3a22; --warn:#e0aa53; --warn-bg:#3e2f14; --danger:#e0776a; --danger-bg:#3e211d;
    --input-bg:#382a1f; --btn-secondary-bg:#382a1f; --soft-tint-bg:#382a1f; --overlay-bg:rgba(0,0,0,.6);
  }
  :root[data-palette="salvia"][data-theme="dark"]{
    --bg:#171c15; --card:#212820; --text:#e6ede1; --text-dim:#a2b099; --border:#3a4535;
    --primary:#93b97e; --primary-dark:#6f8f5c;
    --ok:#7cbf87; --ok-bg:#223829; --warn:#d4a75d; --warn-bg:#3e3018; --danger:#d68a78; --danger-bg:#3e2622;
    --input-bg:#2a3327; --btn-secondary-bg:#2a3327; --soft-tint-bg:#2a3327; --overlay-bg:rgba(0,0,0,.6);
  }
  :root[data-palette="lavanda"][data-theme="dark"]{
    --bg:#1c1721; --card:#26202c; --text:#ece6f0; --text-dim:#ab9fb8; --border:#453a4f;
    --primary:#ab8ed4; --primary-dark:#8067a8;
    --ok:#7fbf96; --ok-bg:#223a2c; --warn:#d9ac60; --warn-bg:#3e2f16; --danger:#d98297; --danger-bg:#3e2028;
    --input-bg:#322a3a; --btn-secondary-bg:#322a3a; --soft-tint-bg:#322a3a; --overlay-bg:rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:calc(90px + var(--safe-bottom));
    min-height:100vh;
  }
  header.app-header{
    background:var(--card);
    padding:14px 16px calc(10px + env(safe-area-inset-top, 0px));
    padding-top:calc(14px + env(safe-area-inset-top, 0px));
    border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:20;
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  }
  header.app-header .header-text{min-width:0;display:flex;align-items:center;gap:8px;}
  header.app-header .icon-btn{
    background:var(--btn-secondary-bg);border:none;color:var(--text);
    width:32px;height:32px;border-radius:10px;flex-shrink:0;
    font-size:16px;display:flex;align-items:center;justify-content:center;
  }
  header.app-header h1{margin:0;font-family:var(--font-agenda);font-size:22px;font-weight:600;color:var(--primary-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header.app-header .sub{margin:2px 0 0;font-size:12.5px;color:var(--text-dim);}
  .theme-switch{display:flex;gap:7px;flex-shrink:0;margin-top:3px;}
  .theme-switch button{
    width:22px;height:22px;border-radius:50%;border:2px solid var(--card);
    box-shadow:0 0 0 1px var(--border);padding:0;cursor:pointer;
  }
  .theme-switch button.active{box-shadow:0 0 0 2px var(--text);}
  .header-controls{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0;}
  .mode-toggle{
    border:1px solid var(--border);background:var(--btn-secondary-bg);color:var(--text);
    width:26px;height:26px;border-radius:50%;font-size:12.5px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  main{padding:12px 16px 24px;max-width:640px;margin:0 auto;}
  section.view{display:none;}
  section.view.active{display:block;animation:fadein .15s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .card{
    background:var(--card);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
    border:1px solid var(--border);
  }
  .card h2{margin:0 0 10px;font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;font-weight:700;}
  .card h2 .count{
    background:var(--primary);color:#fff;border-radius:20px;
    padding:1px 9px;font-size:12px;margin-left:6px;
  }
  .empty-msg{color:var(--text-dim);font-size:14px;padding:8px 2px;}

  .next-class-card{
    background:linear-gradient(150deg,var(--primary),var(--primary-dark));
    color:#fff;
    border-radius:20px;
    padding:16px 18px;
    margin:14px 16px 0;
    position:relative;overflow:hidden;
    box-shadow:0 8px 20px -8px var(--primary-dark);
  }
  .next-class-card::after{
    content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;
    border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none;
  }
  .next-class-card.empty{
    background:var(--btn-secondary-bg);color:var(--text-dim);box-shadow:none;border:1px dashed var(--border);
  }
  .next-class-eyebrow{font-size:11.5px;font-weight:700;color:inherit;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;opacity:.85;}
  .next-class-countdown{font-family:var(--font-agenda);font-size:22px;font-weight:600;color:inherit;margin-bottom:4px;}
  .next-class-info{font-size:13.5px;color:inherit;display:flex;align-items:center;gap:6px;opacity:.95;}
  .next-class-info .dot{width:10px;height:10px;}
  .next-class-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;position:relative;}
  .next-class-actions .btn{
    width:auto;margin-top:0;padding:7px 13px;font-size:13px;border-radius:999px;
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;
  }
  .next-class-card.empty .next-class-actions .btn{background:var(--card);border-color:var(--border);color:var(--text);}
  .next-class-actions .btn.whatsapp{background:rgba(255,255,255,.18);}

  .stats-esperado{
    background:var(--soft-tint-bg);border:1px dashed var(--border);border-radius:14px;
    padding:10px 14px;font-size:13px;color:var(--text-dim);margin-bottom:12px;
  }
  .stats-esperado b{color:var(--text);}

  .stat-row{display:flex;gap:10px;margin-bottom:12px;}
  .stat-box{
    flex:1;background:var(--card);border-radius:var(--radius);
    padding:14px 10px;text-align:center;border:1px solid var(--border);
  }
  .stat-box .num{font-size:22px;font-weight:800;}
  .stat-box .label{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .stat-box.warn .num{color:var(--warn);}
  .stat-box.ok .num{color:var(--ok);}

  .list-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 4px;border-bottom:1px solid var(--border);
  }
  .list-item:last-child{border-bottom:none;}
  .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .item-main{flex:1;min-width:0;}
  .item-title{font-weight:600;font-size:15px;}
  .item-sub{font-size:13px;color:var(--text-dim);margin-top:1px;}
  .item-right{text-align:right;font-size:14px;font-weight:700;white-space:nowrap;}

  .home-card{
    background:var(--card);border:1px solid var(--border);border-radius:18px;
    padding:13px 15px;margin-bottom:10px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.03);
  }
  .home-card .name{font-family:var(--font-agenda);font-weight:600;font-size:16px;margin-bottom:2px;display:flex;align-items:center;gap:6px;}
  .home-card .name .dot{width:10px;height:10px;flex-shrink:0;}
  .home-card .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);}
  .home-card .rate{font-weight:700;color:var(--text);}

  .badge{
    display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;
  }
  .badge.pendiente{background:var(--warn-bg);color:var(--warn);}
  .badge.pagada{background:var(--ok-bg);color:var(--ok);}

  nav.tabs{
    display:flex;gap:6px;margin:16px 16px 4px;
    background:var(--btn-secondary-bg);padding:5px;border-radius:999px;
  }
  nav.tabs button{
    flex:1;border:none;background:transparent;padding:9px 6px;border-radius:999px;
    font-size:13.5px;font-weight:700;color:var(--text-dim);cursor:pointer;
  }
  nav.tabs button.active{background:var(--card);color:var(--primary-dark);box-shadow:0 2px 6px rgba(0,0,0,.08);}

  .fab{
    position:fixed;right:18px;bottom:calc(20px + var(--safe-bottom));z-index:30;
    width:56px;height:56px;border-radius:50%;
    background:var(--primary);color:#fff;border:none;
    font-size:26px;box-shadow:0 6px 16px -2px var(--primary-dark);
    display:flex;align-items:center;justify-content:center;
    line-height:0;
  }
  .fab:active{background:var(--primary-dark);}

  .filter-row{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
  .filter-chip{
    flex-shrink:0;padding:8px 12px;border-radius:10px;border:1px solid var(--border);
    background:var(--btn-secondary-bg);font-size:12.5px;font-weight:700;color:var(--text-dim);white-space:nowrap;
  }
  .filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  /* bottom sheet modal */
  .overlay{
    position:fixed;inset:0;background:var(--overlay-bg);z-index:50;
    display:none;align-items:flex-end;justify-content:center;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--card);width:100%;max-width:640px;
    border-radius:20px 20px 0 0;
    padding:16px 18px calc(16px + var(--safe-bottom));
    max-height:92vh;overflow-y:auto;
    animation:slideup .18s ease;
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
  .sheet-handle{width:40px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 12px;}
  .sheet h3{font-family:var(--font-agenda);margin:0 0 12px;font-size:19px;font-weight:600;color:var(--text);}

  label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin:12px 0 4px;}
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],select,textarea{
    width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:10px;
    font-size:15px;background:var(--input-bg);color:var(--text);font-family:inherit;
  }
  textarea{resize:vertical;min-height:60px;}
  input[type=color]{width:44px;height:36px;border:1px solid var(--border);border-radius:8px;padding:2px;background:var(--card);}

  .swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;}
  .swatch.sel{border-color:var(--text);}

  .row2{display:flex;gap:10px;}
  .row2 > *{flex:1;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:12px 10px;border-radius:13px;border:none;font-size:14px;font-weight:700;
    width:100%;margin-top:16px;
  }
  .btn.primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px -3px var(--primary-dark);}
  .btn.primary:active{background:var(--primary-dark);}
  .btn.secondary{background:var(--btn-secondary-bg);color:var(--text);}
  .btn.danger{background:var(--danger-bg);color:var(--danger);}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .btn-row .btn{margin-top:16px;flex:1;min-width:100px;}

  .checkbox-line{display:flex;align-items:center;gap:10px;padding:10px 0;}
  .checkbox-line input[type=checkbox]{width:22px;height:22px;flex-shrink:0;}
  .checkbox-line span{font-size:15px;}
  .checkbox-line.done span{text-decoration:line-through;color:var(--text-dim);}
  .checkbox-line.done .item-title{text-decoration:line-through;color:var(--text-dim);}
  .checkbox-line .item-main{cursor:pointer;}

  .toggle-pill{
    border:none;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;flex-shrink:0;
  }
  .toggle-pill.pendiente{background:var(--warn-bg);color:var(--warn);}
  .toggle-pill.pagada{background:var(--ok-bg);color:var(--ok);}

  .toast{
    position:fixed;left:50%;bottom:calc(90px + var(--safe-bottom));transform:translateX(-50%);
    background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;
    z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 4px 14px rgba(0,0,0,.2);
  }
  .toast.show{opacity:1;}

  .section-actions{display:flex;gap:8px;margin-bottom:12px;}
  .section-actions .btn{margin-top:0;flex:1;padding:10px;font-size:13px;}

  .btn.whatsapp{background:#25D366;color:#fff;}
  .btn.whatsapp:active{background:#1ea952;}

  .recurrencia-box{border-top:1px dashed var(--border);margin-top:16px;padding-top:6px;}

  .stats-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .stats-nav button{background:var(--btn-secondary-bg);border:none;border-radius:10px;width:40px;height:40px;font-size:18px;font-weight:700;color:var(--text);}
  .stats-nav .stats-label{font-family:var(--font-agenda);font-weight:700;font-size:16px;text-transform:capitalize;color:var(--primary-dark);}

  .serie-tag{font-size:11px;color:var(--primary);margin-right:4px;}

  .tipo-option{
    flex:1;display:flex;align-items:flex-start;gap:8px;
    background:var(--input-bg);border:1px solid var(--border);border-radius:10px;
    padding:10px;font-size:13px;font-weight:600;
  }
  .tipo-option input{margin-top:2px;width:18px;height:18px;flex-shrink:0;}
  .tipo-option small{font-weight:400;color:var(--text-dim);}
  .tipo-option.sel{border-color:var(--primary);background:var(--soft-tint-bg);}

  .dias-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .dia-chip{
    padding:8px 10px;border-radius:20px;border:1px solid var(--border);
    background:var(--card);font-size:12px;font-weight:700;color:var(--text-dim);
  }
  .dia-chip input{display:none;}
  .dia-chip.sel{background:var(--primary);color:#fff;border-color:var(--primary);}

  .calendar-nav{display:flex;align-items:center;gap:4px;margin-bottom:14px;}
  .calendar-nav button{
    flex-shrink:0;background:var(--card);border:none;color:var(--text-dim);
    width:30px;height:46px;border-radius:13px;font-size:16px;font-weight:700;
    display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .calendar-label{flex:1;text-align:center;font-family:var(--font-agenda);font-weight:600;font-size:15.5px;color:var(--text);text-transform:capitalize;}

  .calendar-weekdays{
    display:grid;grid-template-columns:repeat(7,1fr);text-align:center;
    font-size:9px;font-weight:800;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px;
  }

  /* vista semana */
  .day-strip{display:flex;flex:1;gap:3px;}
  .day-chip{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;
    border:none;background:transparent;border-radius:14px;padding:7px 2px 8px;cursor:pointer;
  }
  .day-chip.selected{background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .day-chip .dow{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--text-dim);}
  .day-chip .dnum{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:14px;font-weight:700;color:var(--text);}
  .day-chip.today .dnum{box-shadow:inset 0 0 0 2px var(--primary);}
  .day-chip.selected .dnum{background:var(--primary);color:#fff;box-shadow:none;}
  .day-chip .cdot{width:5px;height:5px;border-radius:50%;background:var(--primary);}
  .day-chip .cdot.hidden-dot{background:transparent;}

  /* vista mes */
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .mg-dow{font-size:9px;font-weight:800;text-transform:uppercase;text-align:center;color:var(--text-dim);padding-bottom:4px;}
  .month-cell{
    aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border:none;background:transparent;border-radius:10px;cursor:pointer;color:var(--text);font-family:inherit;
    font-size:12px;font-weight:700;
  }
  .month-cell.other-month{opacity:.35;}
  .month-cell.today{box-shadow:inset 0 0 0 2px var(--primary);}
  .month-cell.selected{background:var(--primary);color:#fff;box-shadow:none;}
  .mc-dots{display:flex;gap:2px;height:4px;}
  .mc-dot{width:4px;height:4px;border-radius:50%;background:var(--primary);}
  .month-cell.selected .mc-dot{background:#fff;}

  /* detalle del dia (panel fijo debajo de la grilla) */
  .day-detail{background:var(--card);border-radius:20px;border:1px solid var(--border);overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04);margin-top:12px;}
  .day-detail-head{display:flex;align-items:center;gap:8px;padding:15px 16px 8px;}
  .day-detail-head .title{font-family:var(--font-agenda);font-weight:600;font-size:16px;}

  .day-detail-body{padding:4px 10px 12px;}

  .shift-block{
    display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:13px;cursor:pointer;
    border-left:4px solid var(--warn);background:var(--btn-secondary-bg);margin:5px 0;

  .shift-block.pagada{border-left-color:var(--ok);}
  .shift-block .time{font-weight:700;font-size:13.5px;min-width:40px;}
  .shift-block .info{flex:1;min-width:0;}
  .shift-block .home-name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .shift-block .sub{font-size:11.5px;color:var(--text-dim);}
  .pay-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

  .day-add-btn{
    width:100%;border:1.5px dashed var(--border);background:transparent;color:var(--primary-dark);
    border-radius:13px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;margin-top:6px;
  }
  .day-empty{color:var(--text-dim);font-size:12.5px;padding:12px 8px 16px;}

  .clase-tareas{padding:0 4px 2px 34px;}
  .clase-tareas .checkbox-line{padding:4px 0;}
  .clase-tareas .checkbox-line input[type=checkbox]{width:18px;height:18px;}
  .clase-tareas .checkbox-line.done span{text-decoration:line-through;color:var(--text-dim);}

  .tema-grupo{margin-bottom:14px;}

  .ajustes-desc{color:var(--text-dim);font-size:13px;margin:0 0 10px;}

  .tutorial-overlay{
    position:fixed;inset:0;background:var(--overlay-bg);z-index:100;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .tutorial-overlay.show{display:flex;}
  .tutorial-card{
    background:var(--card);border-radius:22px;padding:30px 22px 22px;
    max-width:380px;width:100%;text-align:center;position:relative;
    box-shadow:0 10px 40px rgba(0,0,0,.25);animation:slideup .18s ease;

  .tutorial-skip{
    position:absolute;top:14px;right:14px;background:none;border:none;
    color:var(--text-dim);font-size:13px;font-weight:600;padding:6px 8px;
  }
  .tutorial-icon{font-size:52px;margin-bottom:10px;line-height:1;}
  .tutorial-title{font-family:var(--font-agenda);font-size:20px;color:var(--primary-dark);margin:0 0 10px;}
  .tutorial-desc{font-size:14px;color:var(--text);line-height:1.55;margin:0 0 20px;}
  .tutorial-dots{display:flex;gap:6px;justify-content:center;margin-bottom:20px;}
  .tutorial-dot{width:7px;height:7px;border-radius:50%;background:var(--border);transition:width .15s;}
  .tutorial-dot.active{background:var(--primary);width:18px;border-radius:4px;}
  .tutorial-nav{display:flex;gap:10px;}
  .tutorial-nav .btn{margin-top:0;}
</style>
</head>

<script>
/* =========================================================
   ESTRUCTURA DE DATOS
   ========================================================= */
const STORAGE_KEY = 'estudiantes_app_data_v1';

let db = {
  alumnos: [],  // {id, nombre, tarifa, color, contacto, activo, temasIds:[]}
  clases:  [],  // {id, serieId|null, alumnoId, fecha:'YYYY-MM-DD', horaEntrada:'HH:MM', horaSalida:'HH:MM'|null, duracionMin, monto, pagada, notas}
  temas:   [],  // {id, nombre} -- temas globales del profesor, se vinculan a alumnos vía alumno.temasIds
  tareas:  [],  // {id, alumnoId|null, temaId|null, claseId|null, texto, hecha}
  config:  {tarifaMin:7000, tarifaMax:15000, paleta:'terracota', tema:'auto', tutorialVisto:false}
};

function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      db.alumnos = parsed.alumnos || [];
      db.clases = parsed.clases || [];
      db.temas = parsed.temas || [];
      db.tareas = parsed.tareas || [];
      db.config = Object.assign({tarifaMin:7000, tarifaMax:15000, paleta:'terracota', tema:'auto', tutorialVisto:false}, parsed.config||{});
    }
    // migración de paletas viejas (6 opciones) a las 3 nuevas, y de modoOscuro booleano a tema auto/light/dark
    if(!['terracota','salvia','lavanda'].includes(db.config.paleta)){
      db.config.paleta = (db.config.paleta==='verde') ? 'salvia' : (db.config.paleta==='lila') ? 'lavanda' : 'terracota';
    }
    if(db.config.tema===undefined){
      db.config.tema = db.config.modoOscuro ? 'dark' : 'auto';
    }
    delete db.config.modoOscuro;
    // migración de clases con el esquema viejo (hora + duracionMin -> horaEntrada/horaSalida)
    db.clases.forEach(c=>{
      if(!c.horaEntrada && c.hora){
        c.horaEntrada = c.hora;
        c.horaSalida = c.duracionMin ? sumarMinutos(c.hora, c.duracionMin) : null;
        delete c.hora;
      }
      if(c.serieId===undefined) c.serieId = null;
    });
    // migración de alumnos sin tipo definido: antes todo el mundo se trataba como "niño" (mensaje al contacto)
    db.alumnos.forEach(a=>{
      if(!a.tipo) a.tipo = 'nino';
      if(!Array.isArray(a.temasIds)) a.temasIds = [];
      if(typeof a.telefono !== 'string') a.telefono = '';
      if(typeof a.direccion !== 'string') a.direccion = '';
      if(!Array.isArray(a.mensajes)) a.mensajes = [];
    });
    // migración de tareas sin temaId/claseId definidos
    db.tareas.forEach(t=>{
      if(t.temaId===undefined) t.temaId = null;
      if(t.claseId===undefined) t.claseId = null;
    });
    // migración de temas: antes eran propios de un alumno (alumnoId), ahora son un catálogo
    // global del profesor y se vinculan a cada alumno vía alumno.temasIds
    db.temas.forEach(t=>{
      if(t.alumnoId){
        const alumno = db.alumnos.find(a=>a.id===t.alumnoId);
        if(alumno && !alumno.temasIds.includes(t.id)) alumno.temasIds.push(t.id);
        delete t.alumnoId;
      }
    });
  }catch(e){
    console.error('Error leyendo datos', e);
  }
}

function saveDB(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}

/* helpers de acceso */
function getAlumno(id){ return db.alumnos.find(a => a.id === id); }
function alumnoNombre(id){ const a = getAlumno(id); return a ? a.nombre : '(alumno eliminado)'; }
function alumnoColor(id){ const a = getAlumno(id); return a ? a.color : '#999'; }
function waUrl(phone, text){
  const digits = (phone||'').replace(/\D/g,'');
  const base = digits ? `https://wa.me/${digits}` : 'https://api.whatsapp.com/send';
  return text ? `${base}?text=${encodeURIComponent(text)}` : base;
}
function mapsUrl(direccion){
  return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(direccion||'') + '&travelmode=driving';
}

const COLOR_SWATCHES = ['#ef4444','#f97316','#f59e0b','#84cc16','#22c55e','#14b8a6','#06b6d4','#3b82f6','#6366f1','#a855f7','#ec4899','#78716c'];

/* =========================================================
   NAVEGACIÓN
   ========================================================= */
const views = ['clases','alumnos','tareas','stats'];
const subtitles = {clases:'Tu semana de clases', alumnos:'Tus alumnos', tareas:'Material a preparar', stats:'Cómo te fue este mes'};

function goTo(view){
  currentAlumnoDetalleId = null;
  document.getElementById('view-alumno-detalle').classList.remove('active');
  document.getElementById('backBtn').style.display = 'none';
  views.forEach(v=>{
    document.getElementById('view-'+v).classList.toggle('active', v===view);
  });
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===view);
  });
  document.getElementById('headerSub').textContent = subtitles[view];
  document.getElementById('fabBtn').style.display = (view==='stats') ? 'none' : 'flex';
  renderAll();
}

document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.addEventListener('click', ()=>goTo(b.dataset.view));
});

document.getElementById('fabBtn').addEventListener('click', ()=>{
  const active = document.querySelector('nav.tabs button.active').dataset.view;
  if(active==='alumnos') openAlumnoForm();
  if(active==='clases') openClaseForm();
  if(active==='tareas') openTareaForm();
});

/* =========================================================
   BOTTOM SHEET GENÉRICO
   ========================================================= */
const overlay = document.getElementById('overlay');
const sheetContent = document.getElementById('sheetContent');

function openSheet(html){
  sheetContent.innerHTML = '<div class="sheet-handle"></div>' + html;
  overlay.classList.add('show');
}
function closeSheet(){
  overlay.classList.remove('show');
  sheetContent.innerHTML = '';
}
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeSheet(); });

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function money(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtFecha(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function fechaHoraClase(c){
  return new Date(`${c.fecha}T${c.horaEntrada||'00:00'}`);
}
function sumarMinutos(horaStr, minutos){
  const [h,m] = horaStr.split(':').map(Number);
  const total = h*60+m+minutos;
  const hh = Math.floor(total/60)%24, mm = total%60;
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}
function formatDuracion(min){
  const h = Math.floor(min/60), m = min%60;
  return `${h>0?h+'h ':''}${m>0?m+'m':''}`.trim() || '0m';
}
function formatDuracionTexto(min){
  const h = Math.floor(min/60), m = min%60;
  const parts = [];
  if(h>0) parts.push(`${h} ${h===1?'hora':'horas'}`);
  if(m>0) parts.push(`${m} minutos`);
  return parts.length ? parts.join(' y ') : '0 minutos';
}
const MINUTOS_OPCIONES = ['00','15','30','45'];
function opcionesHoras(min, max, selected){
  let html = '';
  for(let h=min; h<=max; h++){
    const hh = String(h).padStart(2,'0');
    html += `<option value="${hh}" ${hh===selected?'selected':''}>${hh}</option>`;
  }
  return html;
}
function opcionesMinutos(selected){
  return MINUTOS_OPCIONES.map(m=>`<option value="${m}" ${m===selected?'selected':''}>${m}</option>`).join('');
}
function leerHora(idHora, idMinuto){
  const h = document.getElementById(idHora).value;
  if(!h) return null;
  const m = document.getElementById(idMinuto).value;
  return h + ':' + m;
}
function getMonday(d){
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day===0 ? -6 : 1-day);
  date.setDate(date.getDate()+diff);
  date.setHours(0,0,0,0);
  return date;
}
function getSunday(monday){
  const s = new Date(monday);
  s.setDate(s.getDate()+6);
  s.setHours(23,59,59,999);
  return s;
}
function tarifaOptionsHtml(selected){
  const min = db.config.tarifaMin, max = db.config.tarifaMax;
  const opts = [];
  for(let v=min; v<=max; v+=1000) opts.push(v);
  const sel = Number(selected);
  if(sel && !opts.includes(sel)) opts.push(sel);
  opts.sort((a,b)=>a-b);
  return opts.map(v=>`<option value="${v}" ${sel===v?'selected':''}>${money(v)}</option>`).join('');
}

/* =========================================================
   ALUMNOS: alta / edición / baja
   ========================================================= */
function openAlumnoForm(id){
  const editing = id ? getAlumno(id) : null;
  const swatchesHtml = COLOR_SWATCHES.map(c=>
    `<button type="button" class="swatch ${editing && editing.color===c ? 'sel':''}" style="background:${c}" data-color="${c}"></button>`
  ).join('');

  openSheet(`
    <h3>${editing ? 'Editar alumno' : 'Nuevo alumno'}</h3>
    <label>Nombre</label>
    <input type="text" id="f_nombre" value="${editing ? escapeAttr(editing.nombre) : ''}" placeholder="Nombre del alumno">

    <label>Tarifa por hora</label>
    <select id="f_tarifa">${tarifaOptionsHtml(editing ? editing.tarifa : db.config.tarifaMin)}</select>

    <label>¿A quién le mando el WhatsApp?</label>
    <div class="row2">
      <label class="tipo-option ${(!editing || editing.tipo!=='adulto') ? 'sel':''}" id="tipoOptNino">
        <input type="radio" name="f_tipo" value="nino" ${(!editing || editing.tipo!=='adulto') ? 'checked':''} onchange="toggleContactoField()">
        <span>🧒 Niño/a<br><small>le escribo al padre/madre</small></span>
      </label>
      <label class="tipo-option ${editing && editing.tipo==='adulto' ? 'sel':''}" id="tipoOptAdulto">
        <input type="radio" name="f_tipo" value="adulto" ${editing && editing.tipo==='adulto' ? 'checked':''} onchange="toggleContactoField()">
        <span>🧑 Adulto<br><small>le escribo a él/ella</small></span>
      </label>
    </div>

    <div id="contactoRow" style="display:${editing && editing.tipo==='adulto' ? 'none':'block'};">
      <label>Contacto (madre/padre, opcional)</label>

function escapeAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function guardarAlumno(id){
  const nombre = document.getElementById('f_nombre').value.trim();
  const tarifa = parseFloat(document.getElementById('f_tarifa').value) || 0;
  const tipo = document.querySelector('input[name="f_tipo"]:checked').value;
  const contacto = document.getElementById('f_contacto').value.trim();
  const telefono = document.getElementById('f_telefono').value.trim();
  const direccion = document.getElementById('f_direccion').value.trim();
  const color = document.getElementById('f_color').value;
  const temasIds = leerTemasSeleccionadosForm();

  if(!nombre){ showToast('Poné un nombre'); return; }

  if(id){
    const a = getAlumno(id);
    a.nombre = nombre; a.tarifa = tarifa; a.tipo = tipo; a.contacto = contacto; a.telefono = telefono; a.direccion = direccion; a.color = color; a.temasIds = temasIds;
  }else{
    db.alumnos.push({id: uid(), nombre, tarifa, tipo, contacto, telefono, direccion, mensajes:[], color, temasIds, activo:true});
  }
  saveDB();
  closeSheet();
  renderAll();
  showToast('Alumno guardado');
}

function eliminarAlumno(id){
  const tieneClases = db.clases.some(c=>c.alumnoId===id);
  const msg = tieneClases
    ? '¿Eliminar alumno? También se borrarán sus clases y tareas asociadas.'
    : '¿Eliminar alumno?';
  if(!confirm(msg)) return;
  const eraElAbierto = currentAlumnoDetalleId === id;
  db.alumnos = db.alumnos.filter(a=>a.id!==id);
  db.clases = db.clases.filter(c=>c.alumnoId!==id);
  db.tareas = db.tareas.filter(t=>t.alumnoId!==id);
  saveDB();
  closeSheet();
  if(eraElAbierto){ goTo('alumnos'); } else { renderAll(); }
  showToast('Alumno eliminado');
}

function renderMensajesAlumnoForm(alumno){
  const msgs = alumno.mensajes || [];
  if(msgs.length===0) return '<div class="empty-msg">Sin mensajes guardados todavía.</div>';
  return msgs.map(m=>`
    <div class="list-item" style="gap:8px;">
      <div class="item-main">
        <div class="item-title" style="font-size:14px;">${escapeHtml(m.label)}</div>
      </div>
      <button type="button" class="btn danger" style="width:auto;margin:0;padding:8px 12px;" onclick="eliminarMensajeAlumno('${alumno.id}','${m.id}')">🗑</button>
    </div>
  `).join('');
}

function agregarMensajeAlumno(alumnoId){
  const label = document.getElementById('f_msgLabel').value.trim();
  const text = document.getElementById('f_msgText').value.trim();
  if(!label || !text){ showToast('Completá título y texto del mensaje'); return; }
  const a = getAlumno(alumnoId);
  if(!Array.isArray(a.mensajes)) a.mensajes = [];
  a.mensajes.push({id: uid(), label, text});
  saveDB();
  document.getElementById('f_msgLabel').value = '';
  document.getElementById('f_msgText').value = '';
  refrescarListasMensajes(a);
}

function eliminarMensajeAlumno(alumnoId, msgId){
  const a = getAlumno(alumnoId);
  if(!a) return;
  a.mensajes = (a.mensajes||[]).filter(m=>m.id!==msgId);
  saveDB();
  refrescarListasMensajes(a);
}

function refrescarListasMensajes(alumno){

function renderAlumnos(){
  const cont = document.getElementById('listaAlumnos');
  if(db.alumnos.length===0){
    cont.innerHTML = '<div class="card"><div class="empty-msg">No hay alumnos todavía. Tocá el botón + para agregar el primero.</div></div>';
    return;
  }
  cont.innerHTML = db.alumnos.map(a=>{
    const deuda = sumaPendiente(a.id);
    const ahora = new Date();
    const proxima = db.clases
      .filter(c=>c.alumnoId===a.id && fechaHoraClase(c) >= ahora)
      .sort((x,y)=> fechaHoraClase(x)-fechaHoraClase(y))[0];
    return `
    <div class="home-card" onclick="abrirDetalleAlumno('${a.id}')">
      <div class="name"><span class="dot" style="background:${a.color}"></span>${a.tipo==='adulto'?'🧑':'🧒'} ${escapeHtml(a.nombre)}</div>
      <div class="row">
        <span class="rate">${money(a.tarifa)}/hora</span>
        <span>${proxima ? 'Próx: ' + nombreDiaFecha(proxima.fecha) + ' ' + proxima.horaEntrada : 'Sin próxima clase'}</span>
      </div>
      <div class="row" style="margin-top:4px;font-weight:700;color:${deuda>0?'var(--warn)':'var(--ok)'};">${deuda>0 ? 'Debe '+money(deuda) : 'Al día'}</div>
    </div>`;
  }).join('');
}

function sumaPendiente(alumnoId){
  const ahora = new Date();
  return db.clases
    .filter(c=>c.alumnoId===alumnoId && !c.pagada && claseYaOcurrida(c, ahora))
    .reduce((s,c)=>s+Number(c.monto||0),0);
}

function esMesActual(fechaStr){
  const [y,m] = fechaStr.split('-').map(Number);
  const hoy = new Date();
  return y===hoy.getFullYear() && (m-1)===hoy.getMonth();
}

function sumaPendienteMesActual(alumnoId, hoySinHora){
  return db.clases
    .filter(c=>{
      if(c.alumnoId!==alumnoId || c.pagada || !esMesActual(c.fecha)) return false;
      return new Date(c.fecha+'T00:00:00') < hoySinHora;
    })
    .reduce((s,c)=>s+Number(c.monto||0),0);
}

function nombreDiaFecha(fechaStr){
  const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const f = new Date(fechaStr+'T00:00:00');
  return `${dias[f.getDay()]} ${f.getDate()}`;
}

  db.alumnos.forEach(a=>{ if(Array.isArray(a.temasIds)) a.temasIds = a.temasIds.filter(tid=>tid!==id); });

  renderAll();
}

/* =========================================================
   CLASES
   ========================================================= */
const DIAS_SEMANA = [
  {v:1,l:'Lunes'},{v:2,l:'Martes'},{v:3,l:'Miércoles'},{v:4,l:'Jueves'},
  {v:5,l:'Viernes'},{v:6,l:'Sábado'},{v:0,l:'Domingo'}
];

function alumnoOptionsHtml(selectedId){
  if(db.alumnos.length===0) return '<option value="">-- Cargá un alumno primero --</option>';
  return db.alumnos.map(a=>`<option value="${a.id}" ${a.id===selectedId?'selected':''}>${escapeHtml(a.nombre)}</option>`).join('');
}

const DURACIONES_PRESET = [30,60,90,120,150,180,210,240];
function labelDuracionPreset(min){
  const h = Math.floor(min/60), m = min%60;
  const partes = [];
  if(h>0) partes.push(`${h} hora${h!==1?'s':''}`);
  if(m>0) partes.push(`${m} minutos`);
  return partes.join(' ');
}

let repeatDiasHoras = {};

function openClaseForm(id, fechaPreset){
  if(db.alumnos.length===0){ showToast('Primero agregá un alumno'); return; }
  const editing = id ? db.clases.find(c=>c.id===id) : null;
  const today = fechaPreset || new Date().toISOString().slice(0,10);
  repeatDiasHoras = {};

  const nowHClamped = String(Math.min(18, Math.max(8, new Date().getHours()))).padStart(2,'0');
  const [entH, entM] = editing ? editing.horaEntrada.split(':') : [nowHClamped, '00'];

  let presetInicial = '60', customInicial = 60;
  if(editing){
    if(DURACIONES_PRESET.includes(editing.duracionMin)) presetInicial = String(editing.duracionMin);
    else if(editing.duracionMin>0){ presetInicial = 'custom'; customInicial = editing.duracionMin; }
  }
  const opcionesDuracionPreset = DURACIONES_PRESET
    .map(min=>`<option value="${min}" ${String(min)===presetInicial?'selected':''}>${labelDuracionPreset(min)}</option>`).join('')
    + `<option value="custom" ${presetInicial==='custom'?'selected':''}>Personalizada...</option>`;

  const recurrenciaHtml = !editing ? `
    <div class="recurrencia-box">
      <div class="checkbox-line">
        <input type="checkbox" id="f_recurrente" onchange="toggleRecurrenciaPanel()">
        <span>🔁 Repetir todas las semanas</span>
      </div>
      <div id="recurrenciaPanel" style="display:none;">
        <label>¿Qué días repetís?</label>
        <div class="dias-chips" id="diasSemanaChips">${DIAS_SEMANA.map(d=>`
          <label class="dia-chip" data-dia="${d.v}">
            <input type="checkbox" value="${d.v}" onchange="onToggleDiaRecurrente(${d.v}, this.checked); this.parentElement.classList.toggle('sel', this.checked)">
            ${d.l}
          </label>
        `).join('')}</div>
        <div id="diasHorariosBox"></div>

        <label>¿Durante cuántas semanas?</label>
        <input type="number" id="f_semanas" min="1" max="52" value="8" inputmode="numeric">
      </div>
    </div>
  ` : '';

  openSheet(`
    <h3>${editing ? 'Editar clase' : 'Nueva clase'}</h3>
    <label>Alumno</label>
    <select id="f_alumnoId" onchange="recalcularMontoForm()">${alumnoOptionsHtml(editing ? editing.alumnoId : db.alumnos[0].id)}</select>

    <label>Fecha</label>
    <input type="date" id="f_fecha" value="${editing ? editing.fecha : today}">

    <label>Hora de entrada</label>
    <div class="row2">
      <select id="f_horaEntradaH" onchange="recalcularMontoForm()">${opcionesHoras(8,18,entH)}</select>
      <select id="f_horaEntradaM" onchange="recalcularMontoForm()">${opcionesMinutos(entM)}</select>
    </div>

    <label>Duración</label>
    <select id="f_duracionPreset" onchange="onCambioDuracionPreset(); recalcularMontoForm();">${opcionesDuracionPreset}</select>
    <div id="duracionCustomBox" style="display:${presetInicial==='custom'?'block':'none'};">
      <label>Duración personalizada (minutos)</label>
      <input type="number" id="f_duracionCustom" min="5" step="5" value="${customInicial}" oninput="recalcularMontoForm()" inputmode="numeric">
    </div>

    <label>Monto a cobrar</label>
    <select id="f_monto"></select>

    <button type="button" class="btn whatsapp" onclick="enviarWhatsappDesdeForm()">📲 Enviar resumen por WhatsApp</button>

    <label>Notas (opcional)</label>
    <textarea id="f_notas" placeholder="Temas vistos, observaciones...">${editing ? escapeHtml(editing.notas||'') : ''}</textarea>

    <div class="checkbox-line">
      <input type="checkbox" id="f_pagada" ${editing && editing.pagada ? 'checked':''}>
      <span>Ya está pagada</span>
    </div>

    ${recurrenciaHtml}

    <div class="btn-row">
      ${editing ? `<button class="btn danger" onclick="eliminarClase('${editing.id}')">Eliminar</button>` : ''}
      <button class="btn primary" onclick="guardarClase(${editing ? `'${editing.id}'` : 'null'})">Guardar</button>
    </div>
  `);

  const montoInicial = editing ? editing.monto : null;
  recalcularMontoForm(montoInicial);
}

function onToggleDiaRecurrente(dia, checked){
  if(checked){
    repeatDiasHoras[dia] = leerHora('f_horaEntradaH','f_horaEntradaM') || '09:00';
  }else{
    delete repeatDiasHoras[dia];
  }
  renderDiasHorarios();
}

function renderDiasHorarios(){
  const box = document.getElementById('diasHorariosBox');
  if(!box) return;
  const orden = d => d===0 ? 7 : d;
  const dias = Object.keys(repeatDiasHoras).map(Number).sort((a,b)=>orden(a)-orden(b));
  box.innerHTML = dias.map(dv=>{
    const [h,m] = (repeatDiasHoras[dv]||'09:00').split(':');
    const nombre = DIAS_SEMANA.find(d=>d.v===dv).l;
    return `
    <div class="row2" style="align-items:center;margin:6px 0;">
      <span style="flex:1;font-size:13px;font-weight:700;">${nombre}</span>
      <select onchange="actualizarHoraDia(${dv}, this.value, null)">${opcionesHoras(8,20,h)}</select>
      <select onchange="actualizarHoraDia(${dv}, null, this.value)">${opcionesMinutos(m)}</select>
    </div>`;
  }).join('');
}

function actualizarHoraDia(dia, h, m){
  const [ch,cm] = (repeatDiasHoras[dia]||'09:00').split(':');
  repeatDiasHoras[dia] = (h||ch) + ':' + (m||cm);
}

function toggleRecurrenciaPanel(){
  const panel = document.getElementById('recurrenciaPanel');
  const chk = document.getElementById('f_recurrente');
  panel.style.display = chk.checked ? 'block' : 'none';
}

function onCambioDuracionPreset(){
  const val = document.getElementById('f_duracionPreset').value;
  document.getElementById('duracionCustomBox').style.display = val==='custom' ? 'block' : 'none';
}

function leerDuracionPreset(){
  const val = document.getElementById('f_duracionPreset').value;
  if(val==='custom') return parseInt(document.getElementById('f_duracionCustom').value)||0;
  return parseInt(val)||0;
}

function redondearA1000(n){
  return Math.max(0, Math.round(n/1000)*1000);
}

function recalcularMontoForm(montoActual){
  const alumnoId = document.getElementById('f_alumnoId').value;
  const a = getAlumno(alumnoId);

function guardarClase(id){
  const alumnoId = document.getElementById('f_alumnoId').value;
  const fecha = document.getElementById('f_fecha').value;
  const horaEntrada = leerHora('f_horaEntradaH','f_horaEntradaM');
  const monto = parseFloat(document.getElementById('f_monto').value)||0;
  const notas = document.getElementById('f_notas').value.trim();
  const pagada = document.getElementById('f_pagada').checked;
  const duracionMin = leerDuracionPreset();

  if(!alumnoId){ showToast('Elegí un alumno'); return; }
  if(!fecha){ showToast('Elegí una fecha'); return; }
  if(duracionMin<=0){ showToast('Elegí una duración válida'); return; }

  if(id){
    const c = db.clases.find(c=>c.id===id);
    Object.assign(c, {alumnoId, fecha, horaEntrada, horaSalida: sumarMinutos(horaEntrada, duracionMin), duracionMin, monto, notas, pagada});
    saveDB();
    closeSheet();
    renderAll();
    showToast('Clase guardada');
    return;
  }

  const recurrenteChk = document.getElementById('f_recurrente');
  if(recurrenteChk && recurrenteChk.checked){
    const dias = Object.keys(repeatDiasHoras).map(Number);
    if(dias.length===0){ showToast('Elegí al menos un día para repetir'); return; }
    const semanas = Math.max(1, parseInt(document.getElementById('f_semanas').value)||1);
    const ocurrencias = generarOcurrenciasRecurrentes(fecha, repeatDiasHoras, semanas);
    const serieId = uid();
    ocurrencias.forEach(o=>{
      db.clases.push({id: uid(), serieId, alumnoId, fecha:o.fecha, horaEntrada:o.horaEntrada, horaSalida: sumarMinutos(o.horaEntrada, duracionMin), duracionMin, monto, notas, pagada:false});
    });
    saveDB();
    closeSheet();
    renderAll();
    showToast(`Se crearon ${ocurrencias.length} clases`);
    return;
  }

  db.clases.push({id: uid(), serieId:null, alumnoId, fecha, horaEntrada, horaSalida: sumarMinutos(horaEntrada, duracionMin), duracionMin, monto, notas, pagada});
  saveDB();
  closeSheet();
  renderAll();
  showToast('Clase guardada');
}

function generarOcurrenciasRecurrentes(fechaInicioStr, diasConHora, semanas){
  const ocurrencias = [];
  const inicio = new Date(fechaInicioStr+'T00:00:00');
  const inicioSemana = getMonday(inicio);
  const dias = Object.keys(diasConHora).map(Number);
  for(let w=0; w<semanas; w++){
    dias.forEach(dv=>{
      const offset = dv===0 ? 6 : dv-1; // lunes=0 ... domingo=6
      const occ = new Date(inicioSemana);
      occ.setDate(occ.getDate() + w*7 + offset);
      const occStr = occ.toISOString().slice(0,10);
      if(occStr < fechaInicioStr) return;
      ocurrencias.push({fecha: occStr, horaEntrada: diasConHora[dv]});
    });
  }
  return ocurrencias;
}

let calendarioModo = 'semana'; // 'mes' | 'semana'

let calendarioSelectedDate = new Date().toISOString().slice(0,10);

  renderCalendario();
}

function setCalendarioModo(modo){
  calendarioModo = modo;
  renderCalendario();
}

function cambiarMesCalendario(delta){
  calendarioFecha.setMonth(calendarioFecha.getMonth()+delta);
  renderCalendario();
}

function cambiarSemanaCalendario(delta){
  calendarioSemanaInicio.setDate(calendarioSemanaInicio.getDate()+7*delta);
  renderCalendario();
}

function formatoFechaLarga(fechaStr){
  const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const f = new Date(fechaStr+'T00:00:00');
  return `${dias[f.getDay()]} ${f.getDate()} de ${meses[f.getMonth()]}`;
}

function renderCalendario(){
  document.querySelectorAll('#calendarioModoToggle .filter-chip').forEach(b=>{
    b.classList.toggle('active', b.dataset.modo===calendarioModo);
  });
  document.getElementById('calendarioNavMes').style.display = calendarioModo==='mes' ? 'flex' : 'none';
  document.getElementById('calendarioNavSemana').style.display = calendarioModo==='semana' ? 'flex' : 'none';
  document.getElementById('calendarioWeekdays').style.display = calendarioModo==='mes' ? 'grid' : 'none';
  if(calendarioModo==='semana') renderCalendarioSemana(); else renderCalendarioMes();
  renderDayDetail();
}

function renderCalendarioMes(){
  const y = calendarioFecha.getFullYear(), m = calendarioFecha.getMonth();
  const label = calendarioFecha.toLocaleDateString('es-AR', {month:'long', year:'numeric'});
  document.getElementById('calendarioMesLabel').textContent = label.charAt(0).toUpperCase()+label.slice(1);

  const clases = db.clases;

  const porDia = {};
  clases.forEach(c=>{
    (porDia[c.fecha] = porDia[c.fecha] || []).push(c);
  });

  const primerDiaMes = new Date(y, m, 1);
  const diasEnMes = new Date(y, m+1, 0).getDate();
  const offsetInicio = (primerDiaMes.getDay()+6)%7; // 0=Lunes
  const hoyStr = new Date().toISOString().slice(0,10);

  let celdas = '<div class="month-grid">';
  for(let i=0;i<offsetInicio;i++){
    celdas += `<div class="month-cell other-month"></div>`;
  }
  for(let dia=1; dia<=diasEnMes; dia++){
    const fechaStr = `${y}-${String(m+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const clasesDia = porDia[fechaStr] || [];
    const esHoy = fechaStr===hoyStr;
    const seleccionado = fechaStr===calendarioSelectedDate;
    const dots = clasesDia.slice(0,3).map(()=>`<span class="mc-dot"></span>`).join('');
    celdas += `
      <button type="button" class="month-cell ${esHoy?'today':''} ${seleccionado?'selected':''}" onclick="abrirDiaCalendario('${fechaStr}')">
        <span>${dia}</span>
        <span class="mc-dots">${dots}</span>
      </button>
    `;
  }
  celdas += '</div>';

  document.getElementById('calendarioGrid').innerHTML = celdas;
}

function renderCalendarioSemana(){
  const inicio = calendarioSemanaInicio;
  const clases = db.clases;

  const porDia = {};
  clases.forEach(c=>{
    (porDia[c.fecha] = porDia[c.fecha] || []).push(c);
  });

  const dias = ['L','M','M','J','V','S','D'];
  const hoyStr = new Date().toISOString().slice(0,10);
  let celdas = '<div class="day-strip">';
  for(let i=0;i<7;i++){
    const d = addDiasCalendario(inicio, i);
    const fechaStr = toIsoCalendario(d);
    const clasesDia = porDia[fechaStr] || [];
    const esHoy = fechaStr===hoyStr;
    const seleccionado = fechaStr===calendarioSelectedDate;
    celdas += `
      <button type="button" class="day-chip ${seleccionado?'selected':''} ${esHoy?'today':''}" onclick="abrirDiaCalendario('${fechaStr}')">
        <span class="dow">${dias[i]}</span>
        <span class="dnum">${d.getDate()}</span>
        <span class="cdot${clasesDia.length?'':' hidden-dot'}"></span>
      </button>
    `;
  }
  celdas += '</div>';

  document.getElementById('calendarioGrid').innerHTML = celdas;
}

function addDiasCalendario(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function toIsoCalendario(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function abrirDiaCalendario(fechaStr){
  calendarioSelectedDate = fechaStr;
  renderCalendario();
}

function renderDayDetail(){
  const container = document.getElementById('calendarioDayDetail');
  if(!container) return;
  const fechaStr = calendarioSelectedDate;
  const hoyStr = new Date().toISOString().slice(0,10);
  const clasesDia = db.clases.filter(c=>c.fecha===fechaStr);
  clasesDia.sort((a,b)=> a.horaEntrada.localeCompare(b.horaEntrada));

  let html = `<div class="day-detail-head">
      <span class="title">${formatoFechaLarga(fechaStr)}</span>
      ${fechaStr===hoyStr ? '<span class="badge-today">HOY</span>' : ''}
    </div><div class="day-detail-body">`;

  if(clasesDia.length===0){
    html += '<div class="day-empty">No hay clases este día 🌿</div>';
  }else{
    clasesDia.forEach(c=>{
      const rangoHora = c.horaSalida ? `${c.horaEntrada}-${c.horaSalida}` : `${c.horaEntrada} · ${formatDuracion(c.duracionMin)} prevista`;
      const tareasClase = db.tareas.filter(t=>t.claseId===c.id);
      const tareasHtml = tareasClase.length ? `
        <div class="clase-tareas">
          ${tareasClase.map(t=>`
            <div class="checkbox-line ${t.hecha?'done':''}" style="padding:4px 0;">
              <input type="checkbox" ${t.hecha?'checked':''} onclick="toggleTarea('${t.id}', event); renderDayDetail();">
              <span style="font-size:13px;">${t.temaId ? `<b>${escapeHtml(temaNombre(t.temaId))}:</b> ` : '📌 '}${escapeHtml(t.texto)}</span>
            </div>
          `).join('')}
        </div>
      ` : '';
      html += `
      <div>
        <div class="shift-block ${c.pagada?'pagada':''}" onclick="openClaseForm('${c.id}')">
          <span class="pay-dot" style="background:${alumnoColor(c.alumnoId)}"></span>
          <span class="time">${c.horaEntrada}</span>
          <div class="info">
            <div class="home-name">${c.serieId ? '<span class="serie-tag">🔁</span>' : ''}${escapeHtml(alumnoNombre(c.alumnoId))}</div>
            <div class="sub">${rangoHora} · ${money(c.monto)} · ${c.pagada?'Pagada':'Pendiente'}</div>
          </div>
        </div>
        ${tareasHtml}
      </div>`;
    });
  }
  html += `<button class="day-add-btn" onclick="openClaseForm(null, '${fechaStr}')">+ Agregar clase este día</button>`;
  html += '</div>';
  container.innerHTML = html;
}

function guardarTarea(id){
  const alumnoId = document.getElementById('f_t_alumnoId').value || null;
  const texto = document.getElementById('f_t_texto').value.trim();
  if(!texto){ showToast('Escribí una descripción'); return; }

  let temaId = null;
  let claseId = null;
  if(alumnoId){
    const temaSelVal = document.getElementById('f_t_temaId').value;
    if(temaSelVal==='__nuevo__'){
      const nombreNuevo = document.getElementById('f_t_temaNuevo').value.trim();
      if(!nombreNuevo){ showToast('Escribí el nombre del nuevo tema'); return; }
      const nuevoTema = {id: uid(), nombre: nombreNuevo};
      db.temas.push(nuevoTema);
      const alumno = getAlumno(alumnoId);
      if(alumno){
        if(!Array.isArray(alumno.temasIds)) alumno.temasIds = [];
        alumno.temasIds.push(nuevoTema.id);
      }
      temaId = nuevoTema.id;
    }else if(temaSelVal){

    }
    claseId = document.getElementById('f_t_claseId').value || null;
  }

  if(id){
    const t = db.tareas.find(t=>t.id===id);
    t.alumnoId = alumnoId; t.temaId = temaId; t.claseId = claseId; t.texto = texto;

  renderAll();

function toggleTemaAlumno(alumnoId, temaId){
  const alumno = getAlumno(alumnoId);
  if(!Array.isArray(alumno.temasIds)) alumno.temasIds = [];
  const idx = alumno.temasIds.indexOf(temaId);
  if(idx>=0) alumno.temasIds.splice(idx,1); else alumno.temasIds.push(temaId);
  saveDB();
  renderDetalleAlumno();
}

function crearTemaDesdeDetalle(alumnoId){
  const input = document.getElementById('f_nuevoTemaDetalle');
  const nombre = input.value.trim();
  if(!nombre){ showToast('Escribí un nombre de tema'); return; }
  const nuevo = {id: uid(), nombre};
  db.temas.push(nuevo);
  const alumno = getAlumno(alumnoId);
  if(!Array.isArray(alumno.temasIds)) alumno.temasIds = [];
  alumno.temasIds.push(nuevo.id);
  saveDB();
  renderDetalleAlumno();
}

function renderDetalleAlumno(){
  if(!currentAlumnoDetalleId) return;
  const alumno = getAlumno(currentAlumnoDetalleId);
  if(!alumno){ goTo('alumnos'); return; }

  document.getElementById('headerSub').textContent = `${alumno.tipo==='adulto'?'🧑':'🧒'} ${alumno.nombre}`;

  const deuda = sumaPendiente(alumno.id);
  document.getElementById('detalleAlumnoHeader').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="dot" style="width:22px;height:22px;background:${alumno.color}"></div>
      <div style="flex:1;min-width:0;">
        <div style="font-family:var(--font-agenda);font-size:19px;font-weight:700;color:var(--primary-dark);">${escapeHtml(alumno.nombre)}</div>
        <div class="item-sub">${money(alumno.tarifa)}/hora · ${alumno.tipo==='adulto'?'Adulto':'Niño/a'}</div>
      </div>
      <div class="item-right" style="color:${deuda>0?'var(--warn)':'var(--ok)'}">
        <div style="font-size:11px;font-weight:600;">${deuda>0?'Pendiente':'Al día'}</div>
        ${deuda>0 ? `<div>${money(deuda)}</div>` : ''}
      </div>
    </div>
    <div class="btn-row">
      <button class="btn secondary" onclick="openAlumnoForm('${alumno.id}')">✎ Editar datos</button>
      <button class="btn danger" onclick="eliminarAlumno('${alumno.id}')">Eliminar</button>
    </div>
  `;

  document.getElementById('detalleMensajes').innerHTML = renderMensajesAlumnoForm(alumno);

  const ahora = new Date();
  const proximas = db.clases
    .filter(c=>c.alumnoId===alumno.id && fechaHoraClase(c) >= ahora)
    .sort((a,b)=> fechaHoraClase(a)-fechaHoraClase(b))
    .slice(0,3);
  document.getElementById('detalleProximasClases').innerHTML = proximas.length ? proximas.map(c=>{
    const rangoHora = c.horaSalida ? `${c.horaEntrada}-${c.horaSalida}` : `${c.horaEntrada} · ${formatDuracion(c.duracionMin)} prevista`;
    return `
    <div class="list-item" onclick="irADiaEnCalendario('${c.fecha}')" style="cursor:pointer;">
      <div class="dot" style="background:${alumno.color}"></div>
      <div class="item-main">
        <div class="item-title">${nombreDiaFecha(c.fecha)}</div>
        <div class="item-sub">${rangoHora}</div>
      </div>
      <div class="item-right">📅</div>
    </div>`;
  }).join('') : '<div class="empty-msg">No tiene clases próximas agendadas.</div>';

  renderDetalleTemas(alumno.id);

  const tareasAlumno = db.tareas.filter(t=>t.alumnoId===alumno.id);
  const temasAlumno = temasDeAlumno(alumno.id);
  let html = '';
  temasAlumno.forEach(tema=>{
    const tareasTema = tareasAlumno.filter(t=>t.temaId===tema.id);
    html += `<div class="tema-grupo"><div class="tema-grupo-titulo">${escapeHtml(tema.nombre)}</div>`;
    html += tareasTema.length ? tareasTema.map(t=>tareaLineHtml(t)).join('') : '<div class="empty-msg">Sin tareas todavía.</div>';
    html += `</div>`;
  });
  const tareasSinTema = tareasAlumno.filter(t=>!t.temaId);
  if(tareasSinTema.length){
    html += `<div class="tema-grupo"><div class="tema-grupo-titulo">General</div>`;
    html += tareasSinTema.map(t=>tareaLineHtml(t)).join('');
    html += `</div>`;
  }
  document.getElementById('detalleTareasPorTema').innerHTML = html || '<div class="empty-msg">No hay tareas cargadas para este alumno.</div>';
}

/* =========================================================
   DASHBOARD
   ========================================================= */
function formatCuentaRegresiva(ms){
  if(ms<=0) return '¡Es ahora!';
  const totalMin = Math.round(ms/60000);
  const dias = Math.floor(totalMin/1440);
  const horas = Math.floor((totalMin%1440)/60);
  const mins = totalMin%60;
  if(dias>0) return `${dias} día${dias!==1?'s':''} y ${horas} hora${horas!==1?'s':''}`;
  if(horas>0) return `${horas} hora${horas!==1?'s':''} y ${mins} min`;
  return `${mins} min`;
}

function renderProximaClaseCountdown(c, ahora){
  const card = document.getElementById('nextClassCard');
  if(!c){ card.hidden = true; return; }
  card.hidden = false;
  document.getElementById('nextClassCountdown').textContent = formatCuentaRegresiva(fechaHoraClase(c)-ahora);
  document.getElementById('nextClassAlumno').textContent = alumnoNombre(c.alumnoId);
  document.getElementById('nextClassDot').style.background = alumnoColor(c.alumnoId);
  document.getElementById('nextClassCuando').textContent = `${nombreDiaFecha(c.fecha)} · ${c.horaEntrada}`;

  const alumno = getAlumno(c.alumnoId);
  const acciones = [];
  if(alumno){
    acciones.push(`<button type="button" class="btn whatsapp" onclick="abrirWhatsappAlumno('${alumno.id}')">💬 WhatsApp</button>`);
    if(alumno.direccion){
      acciones.push(`<button type="button" class="btn secondary" onclick="abrirComoLlego('${alumno.id}')">📍 Cómo llego</button>`);
    }
  }
  document.getElementById('nextClassActions').innerHTML = acciones.join('');
}

function renderBannerYStats(){
  const ahora = new Date();
  const hoySinHora = new Date(ahora);
  hoySinHora.setHours(0,0,0,0);

  // Próxima clase (banner global, visible en cualquier tab)
  const proxima = db.clases
    .filter(c => fechaHoraClase(c) >= ahora)
    .sort((a,b)=> fechaHoraClase(a) - fechaHoraClase(b))[0];
  renderProximaClaseCountdown(proxima, ahora);

  // Clases esta semana
  const monday = getMonday(ahora);
  const sunday = getSunday(monday);
  const clasesEstaSemana = db.clases.filter(c=>{
    const f = new Date(c.fecha+'T00:00:00');
    return f>=monday && f<=sunday;
  }).length;
  document.getElementById('statProximas').textContent = clasesEstaSemana;

  // Total pendiente este mes
  const totalPendiente = db.alumnos
    .reduce((s,a)=>s+sumaPendienteMesActual(a.id, hoySinHora), 0);
  document.getElementById('statPendienteMonto').textContent = money(totalPendiente);

  // Tareas pendientes
  document.getElementById('statTareas').textContent = db.tareas.filter(t=>!t.hecha).length;
}

/* =========================================================
   ESTADÍSTICAS
   ========================================================= */
let statsFecha = new Date();

function cambiarMesStats(delta){
  statsFecha.setMonth(statsFecha.getMonth()+delta);
  renderStats();
}

function claseYaOcurrida(c, ahora){
  const horaRef = c.horaSalida || c.horaEntrada;
  return new Date(`${c.fecha}T${horaRef}`) <= ahora;
}

function renderStats(){
  const ahora = new Date();
  const y = statsFecha.getFullYear(), m = statsFecha.getMonth();
  const label = statsFecha.toLocaleDateString('es-AR', {month:'long', year:'numeric'});
  document.getElementById('statsMesLabel').textContent = label.charAt(0).toUpperCase()+label.slice(1);

  const clasesMes = db.clases.filter(c=>{
    const [cy,cm] = c.fecha.split('-').map(Number);
    return cy===y && (cm-1)===m;
  });
  const clasesDadas = clasesMes.filter(c=>claseYaOcurrida(c, ahora));

  const horas = clasesDadas.reduce((s,c)=>s+(c.duracionMin||0),0)/60;
  const dado = clasesDadas.reduce((s,c)=>s+Number(c.monto||0),0);
  const esperado = clasesMes.reduce((s,c)=>s+Number(c.monto||0),0);
  const cobrado = clasesMes.filter(c=>c.pagada).reduce((s,c)=>s+Number(c.monto||0),0);
  const pendiente = Math.max(0, dado-cobrado);

  document.getElementById('statsHoras').textContent = horas.toLocaleString('es-AR',{maximumFractionDigits:1});
  document.getElementById('statsMonto').textContent = money(dado);
  document.getElementById('statsCobrado').textContent = money(cobrado);
  document.getElementById('statsPendiente').textContent = money(pendiente);
  document.getElementById('statsEsperado').innerHTML =
    `📅 Monto esperado este mes si dicto todas las clases programadas: <b>${money(esperado)}</b>`;

  const porAlumno = db.alumnos.map(a=>{
    const cs = clasesDadas.filter(c=>c.alumnoId===a.id);
    const h = cs.reduce((s,c)=>s+(c.duracionMin||0),0)/60;
    const mo = cs.reduce((s,c)=>s+Number(c.monto||0),0);
    return {alumno:a, horas:h, monto:mo, cantidad:cs.length};
  }).filter(x=>x.cantidad>0).sort((a,b)=>b.monto-a.monto);

  document.getElementById('statsPorAlumno').innerHTML = porAlumno.length ? porAlumno.map(x=>`
    <div class="list-item">
      <div class="dot" style="background:${x.alumno.color}"></div>
      <div class="item-main">
        <div class="item-title">${escapeHtml(x.alumno.nombre)}</div>
        <div class="item-sub">${x.cantidad} clase(s) · ${x.horas.toLocaleString('es-AR',{maximumFractionDigits:1})}h</div>
      </div>
      <div class="item-right">${money(x.monto)}</div>
    </div>
  `).join('') : '<div class="empty-msg">Sin clases dadas este mes todavía.</div>';
}

/* =========================================================
   AJUSTES: EXPORTAR / IMPORTAR
   ========================================================= */
const PALETTES = [
  {id:'terracota', label:'Terracota', swatch:'#c1673b'},
  {id:'salvia', label:'Salvia', swatch:'#6f8f5c'},
  {id:'lavanda', label:'Lavanda', swatch:'#8067a8'}
];

function aplicarPaleta(){
  document.documentElement.setAttribute('data-palette', db.config.paleta || 'terracota');
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  const p = PALETTES.find(x=>x.id===(db.config.paleta||'terracota'));
  if(metaTheme && p) metaTheme.setAttribute('content', p.swatch);
}

function elegirPaleta(key){
  db.config.paleta = key;
  saveDB();
  try{ localStorage.setItem('estudiantes_palette_v1', key); }catch(e){}
  aplicarPaleta();
  renderThemeSwitch();
}

function renderThemeSwitch(){
  const cont = document.getElementById('themeSwitch');
  if(!cont) return;
  const current = db.config.paleta || 'terracota';
  cont.innerHTML = PALETTES.map(p=>
    `<button type="button" class="${p.id===current?'active':''}" style="background:${p.swatch}" onclick="elegirPaleta('${p.id}')" aria-label="Paleta ${p.label}" title="${p.label}"></button>`
  ).join('');
}

const TEMA_ICONS = {auto:'🌓', light:'☀️', dark:'🌙'};
function aplicarModoOscuro(){
  const tema = db.config.tema || 'auto';
  if(tema==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', tema);
  renderModeToggle();
}
function setTema(tema){
  db.config.tema = tema;
  saveDB();
  try{ localStorage.setItem('estudiantes_theme_v1', tema); }catch(e){}
  aplicarModoOscuro();
}
function renderModeToggle(){
  const btn = document.getElementById('modeToggle');
  if(!btn) return;
  const tema = db.config.tema || 'auto';
  btn.textContent = TEMA_ICONS[tema];
  const labels = {auto:'Modo automático (según el celular)', light:'Modo claro', dark:'Modo oscuro'};
  btn.title = labels[tema] + ' · tocá para cambiar';
}
document.getElementById('modeToggle').addEventListener('click', ()=>{
  const order = ['auto','light','dark'];
  const tema = db.config.tema || 'auto';
  const next = order[(order.indexOf(tema)+1) % order.length];
  setTema(next);
});

function abrirAjustes(){
  openSheet(`
    <h3>Ajustes</h3>
    <div class="card">
      <h2>📚 Temas (los de estudio)</h2>
      <p class="ajustes-desc">Las materias que le das a tus alumnos (Matemáticas, Biología...). Se crean una vez y se vinculan a cada alumno desde su ficha.</p>
      <button type="button" class="btn secondary" onclick="abrirGestionTemas()">Gestionar mis temas</button>
    </div>

    <div class="card">
      <h2>💲 Rango de precios</h2>
      <p class="ajustes-desc">Piso y techo del selector de tarifa por hora al cargar un alumno, y del monto a cobrar al crear una clase.</p>
      <div class="row2">
        <input type="number" id="f_tarifaMin" step="1000" min="0" inputmode="numeric" value="${db.config.tarifaMin}">
        <input type="number" id="f_tarifaMax" step="1000" min="0" inputmode="numeric" value="${db.config.tarifaMax}">
      </div>
      <button type="button" class="btn secondary" onclick="guardarRangoTarifas()">Guardar rango</button>
    </div>

    <div class="card">
      <h2>❓ Ayuda</h2>
      <p class="ajustes-desc">¿Te olvidaste cómo se usa alguna parte? Volvé a ver la introducción rápida.</p>
      <button type="button" class="btn secondary" onclick="closeSheet(); mostrarTutorial();">Ver el tutorial otra vez</button>
    </div>

    <div class="card">
      <h2>💾 Datos</h2>
      <p class="ajustes-desc">Tus datos se guardan solo en este dispositivo (localStorage). Exportá un respaldo periódicamente por si cambiás de celular o borrás el navegador.</p>
      <button type="button" class="btn primary" onclick="exportarDatos()">⬇️ Exportar datos (JSON)</button>

      <label style="margin-top:16px;">Importar datos desde archivo</label>
      <input type="file" id="importFile" accept="application/json,.json">
      <button type="button" class="btn secondary" onclick="importarDatos()">⬆️ Importar (reemplaza los datos actuales)</button>

      <div style="margin-top:16px;font-size:13px;color:var(--text-dim);">Alumnos: ${db.alumnos.length} · Clases: ${db.clases.length} · Temas: ${db.temas.length} · Tareas: ${db.tareas.length}</div>

function guardarRangoTarifas(){
  const min = parseInt(document.getElementById('f_tarifaMin').value)||7000;
  const max = parseInt(document.getElementById('f_tarifaMax').value)||15000;
  if(min>=max){ showToast('El piso debe ser menor que el techo'); return; }
  db.config.tarifaMin = min;
  db.config.tarifaMax = max;
  saveDB();
  showToast('Rango de tarifas actualizado');
}

function exportarDatos(){
  const data = JSON.stringify(db, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fecha = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `EstudiAntes_backup_${fecha}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Datos exportados');
}

function importarDatos(){
  const input = document.getElementById('importFile');
  const file = input.files[0];
  if(!file){ showToast('Elegí un archivo primero'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || typeof parsed !== 'object') throw new Error('formato inválido');
      if(!confirm('Esto reemplazará TODOS tus datos actuales. ¿Continuar?')) return;
      db.alumnos = Array.isArray(parsed.alumnos) ? parsed.alumnos : [];
      db.clases = Array.isArray(parsed.clases) ? parsed.clases : [];
      db.temas = Array.isArray(parsed.temas) ? parsed.temas : [];
      db.tareas = Array.isArray(parsed.tareas) ? parsed.tareas : [];
      db.config = Object.assign({tarifaMin:7000, tarifaMax:15000, paleta:'terracota', tema:'auto', tutorialVisto:false}, parsed.config||{});
      if(!['terracota','salvia','lavanda'].includes(db.config.paleta)){
        db.config.paleta = (db.config.paleta==='verde') ? 'salvia' : (db.config.paleta==='lila') ? 'lavanda' : 'terracota';
      }
      db.alumnos.forEach(a=>{
        if(!Array.isArray(a.temasIds)) a.temasIds = [];
        if(typeof a.telefono !== 'string') a.telefono = '';
        if(typeof a.direccion !== 'string') a.direccion = '';
        if(!Array.isArray(a.mensajes)) a.mensajes = [];
      });
      saveDB();
      aplicarPaleta();
      aplicarModoOscuro();
      renderThemeSwitch();
      renderModeToggle();
      closeSheet();
      renderAll();
      showToast('Datos importados correctamente');
    }catch(err){
      showToast('Archivo inválido');
    }
  };
  reader.readAsText(file);
}

function borrarTodo(){
  if(!confirm('Esto borra TODOS los alumnos, clases y tareas. ¿Estás seguro?')) return;
  if(!confirm('Última confirmación: se perderá todo lo que no hayas exportado. ¿Continuar?')) return;
  db.alumnos = []; db.clases = []; db.temas = []; db.tareas = [];
  saveDB();
  closeSheet();
  renderAll();
  showToast('Datos borrados');
}

const TUTORIAL_PASOS = [
  {icon:'🌿', titulo:'¡Bienvenido/a a EstudiAntes!', desc:'Organizá tus clases particulares: alumnos, horarios, pagos y tareas, todo en un solo lugar. Tus datos se guardan solo en este dispositivo.'},
  {icon:'👤', titulo:'Cargá tus alumnos', desc:'Agregá cada alumno con su tarifa por hora, un color identificador y los temas que le das. Desde su ficha vas a ver sus próximas clases y lo que le falta.'},
  {icon:'📅', titulo:'Organizá tus clases', desc:'Tocá un día del calendario para agregar o ver clases. Podés crearlas recurrentes (semanales, quincenales o mensuales) y marcarlas como pagadas de a una o todas juntas.'},
  {icon:'📝', titulo:'Anotá el material a preparar', desc:'Cargá tareas o temas pendientes por alumno para no olvidarte de qué preparar antes de cada clase.'},
  {icon:'🏠', titulo:'Todo de un vistazo', desc:'Arriba de todo siempre ves tu próxima clase, con accesos directos a WhatsApp y cómo llegar. En Estadísticas, cuánto diste y cobraste cada mes.'},
  {icon:'⚙️', titulo:'Hacela tuya', desc:'Los puntitos de color y la lunita del header cambian la paleta y el modo oscuro. Desde el engranaje ⚙️ accedés a tus temas, tarifas, tutorial y respaldo de datos.'}
];
let tutorialPasoActual = 0;

function mostrarTutorial(){
  tutorialPasoActual = 0;
  renderTutorialPaso();
  document.getElementById('tutorialOverlay').classList.add('show');
}

function renderTutorialPaso(){
  const paso = TUTORIAL_PASOS[tutorialPasoActual];
  document.getElementById('tutorialIcon').textContent = paso.icon;
  document.getElementById('tutorialTitle').textContent = paso.titulo;
  document.getElementById('tutorialDesc').textContent = paso.desc;
  document.getElementById('tutorialDots').innerHTML = TUTORIAL_PASOS.map((_,i)=>
    `<div class="tutorial-dot ${i===tutorialPasoActual?'active':''}"></div>`
  ).join('');
  document.getElementById('tutorialBackBtn').style.visibility = tutorialPasoActual===0 ? 'hidden' : 'visible';
  document.getElementById('tutorialNextBtn').textContent = tutorialPasoActual===TUTORIAL_PASOS.length-1 ? 'Empezar' : 'Siguiente';
}

function tutorialPaso(dir){
  if(dir>0 && tutorialPasoActual===TUTORIAL_PASOS.length-1){ cerrarTutorial(); return; }
  tutorialPasoActual = Math.min(TUTORIAL_PASOS.length-1, Math.max(0, tutorialPasoActual+dir));
  renderTutorialPaso();
}

function cerrarTutorial(){
  document.getElementById('tutorialOverlay').classList.remove('show');
  db.config.tutorialVisto = true;
  saveDB();
}

   INIT

loadDB();
aplicarPaleta();
aplicarModoOscuro();
renderThemeSwitch();
renderModeToggle();
renderAll();
if(!db.config.tutorialVisto) mostrarTutorial();

setInterval(renderBannerYStats, 60000);
